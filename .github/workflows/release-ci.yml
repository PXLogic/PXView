name: PXView Release CI

# ============================================================
# Release 构建 + 多层测试工作流。
#
# 本工作流在 push 到 main 时运行，包含 4 个并行 job：
#
# Job 1: release-build-and-tests
#   Release 编译 → 安装 → 全量 E2E 测试 (19 个测试套件)
#   使用 3 个 PXView 实例并行测试（端口 10110/10111/10112）
#   每个 PXView 实例跑约 6-7 个测试文件，总时间减少约 60%
#
# Job 2: asan-core-tests
#   Debug 编译 (ASan + UBSan) → 核心测试子集
#   只跑 test_01 (MCP 协议) + test_03 (采集基础) + test_05 (数据完整性)
#   ASan 2-5x 减速下核心子集约 15 分钟完成
#
# Job 3: tsan-races
#   Debug 编译 (TSan) → headless + GUI 两阶段
#   直接复用 e2e-linux.yml 的 TSan 逻辑
#
# Job 4: clang-tidy-fast
#   Debug 编译 + Clang-Tidy（仅 bug-finding checks）
#   使用 .clang-tidy-ci 配置（clang-analyzer + bugprone + cert + concurrency）
#   跳过 readability/modernize/misc/performance/cppcoreguidelines
#   预计 15-20 分钟（vs 全量 57+ 分钟）
# ============================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Release Build + Full E2E Tests (3-way parallel)
  # Release 编译没有 ASan/TSan 减速，跑全部 19 个测试套件。
  # 使用 3 个 PXView 实例（端口 10110/10111/10112）并行测试，
  # 每个实例跑约 6-7 个测试文件，总时间约减少 60%。
  # ============================================================
  release-build-and-tests:
    name: Release Build + Full E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"

    steps:
      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Python 3.14 via deadsnakes PPA
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            python3.14 python3.14-dev python3.14-venv
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.14
          python3.14 -m pip install -U setuptools
          python3.14 --version

      - name: Setup Rust toolchain (for Tauri desktop app)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev nlohmann-json3-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev \
            sdcc wget zip

      - name: Install Qt via aqtinstall
        run: |
          python3 -m pip install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets qtmultimedia --outputdir ${{ env.QT_PREFIX }}

      - name: Build qtwayland platform plugin
        run: |
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build

      - name: Configure CMake (Release)
        run: |
          rm -rf build && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TAURI=ON \
            -DDISABLE_WERROR=ON \
            -DCMAKE_INSTALL_PREFIX=../install.dir/usr \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Build and Install PXView
        run: |
          cd build
          ninja -j $(nproc)
          ninja install
          echo "=== Installed binary ==="
          ls -la ../install.dir/usr/bin/PXView
          file ../install.dir/usr/bin/PXView

      - name: Setup Python for testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Bundle Python standard library
        run: |
          PY_VERSION=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Bundling Python $PY_VERSION standard library"
          mkdir -p install.dir/usr/lib/python$PY_VERSION
          cp -a /usr/lib/python$PY_VERSION/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          SETUP_STDLIB=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])" 2>/dev/null || true)
          if [ -n "$SETUP_STDLIB" ] && [ -d "$SETUP_STDLIB" ]; then
            cp -a "$SETUP_STDLIB"/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          fi
          mkdir -p install.dir/usr/lib/python$PY_VERSION/lib-dynload
          cp -a /usr/lib/python$PY_VERSION/lib-dynload/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          SETUP_DYNLOAD=$(python3 -c "import _struct, os; print(os.path.dirname(_struct.__file__))" 2>/dev/null || true)
          if [ -n "$SETUP_DYNLOAD" ] && [ -d "$SETUP_DYNLOAD" ]; then
            cp -a "$SETUP_DYNLOAD"/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          fi
          rm -rf install.dir/usr/lib/python$PY_VERSION/test
          rm -rf install.dir/usr/lib/python$PY_VERSION/__pycache__
          find install.dir/usr/lib/python$PY_VERSION -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Bundled Python stdlib size:"
          du -sh install.dir/usr/lib/python$PY_VERSION

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-timeout
          pip install -e ./pxview-automation

      - name: Run full E2E test suite (Release mode, 3-way parallel)
        run: |
          export LD_LIBRARY_PATH="$PWD/install.dir/usr/lib:${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"
          export QT_QPA_PLATFORM=offscreen
          PXV_BIN="$PWD/install.dir/usr/bin/PXView"

          # ---- Define 3 test groups (balanced by estimated runtime) ----
          GROUP1="test_01_mcp_protocol.py test_02_device_management.py test_03_capture_basic.py test_05_data_integrity.py test_13_signal_data.py test_14_16_config.py test_21_error_handling.py test_27_cursor_export.py"
          GROUP2="test_04_capture_timed_10s.py test_06_export_import.py test_07_decoder_i2c.py test_08_decoder_spi.py test_09_decoder_uart.py test_10_decoder_can_pwm.py test_26_i2c_real_decode.py"
          GROUP3="test_12_decoder_batch.py test_17_18_filter_invert.py test_19_20_session_advanced.py test_22_stress.py test_23_decoder_stacked.py test_24_real_decode.py test_25_pwm_mixed_stress.py"

          # ---- Helper: wait for MCP server to be ready (probe the port, not the PID) ----
          # PXView may be reparented/detached from the launching shell, so we rely
          # on the MCP endpoint actually responding rather than on the tracked PID
          # staying alive (a stale PID caused false "exited prematurely" reports).
          wait_for_mcp() {
            local port=$1
            local pid=$2
            local url="http://127.0.0.1:${port}/mcp"
            for i in $(seq 1 90); do
              RESP=$(curl -s -X POST "$url" \
                -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
                --max-time 5 2>/dev/null || true)
              if echo "$RESP" | grep -q "protocolVersion"; then
                echo "MCP server (port $port) ready after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "ERROR: MCP server (port $port) did not start within 90s"
            return 1
          }

          # ---- Helper: run a test group against a specific MCP port ----
          run_test_group() {
            local group_name=$1
            local port=$2
            local tests=$3
            local url="http://127.0.0.1:${port}/mcp"

            echo "=== [$group_name] Running: $tests ==="
            cd tests
            PXVIEW_NO_AUTO_START=1 \
            PXVIEW_MCP_URL="$url" \
            PXVIEW_STARTUP_TIMEOUT=30 \
            python -m pytest $tests -v \
              --tb=short --timeout=300 --timeout-method=thread \
              --html="$GITHUB_WORKSPACE/${group_name}_report.html" \
              --junitxml="$GITHUB_WORKSPACE/${group_name}_report.xml" \
              --self-contained-html \
              2>&1 | sed "s/^/[$group_name] /" \
              || echo "WARNING: [$group_name] Tests had failures"
            cd ..

            # Fallback XML
            if [ ! -f "$GITHUB_WORKSPACE/${group_name}_report.xml" ]; then
              echo '<?xml version="1.0" encoding="UTF-8"?>' > "$GITHUB_WORKSPACE/${group_name}_report.xml"
              echo "<testsuites><testsuite name=\"$group_name\" tests=\"0\" failures=\"0\" errors=\"1\" time=\"0\"><testcase name=\"pytest-crash\"><error message=\"pytest did not generate report\"/></testcase></testsuite></testsuites>" >> "$GITHUB_WORKSPACE/${group_name}_report.xml"
            fi
          }

          # ---- Start 3 PXView instances (direct children of this shell; nohup avoids SIGHUP) ----
          nohup "$PXV_BIN" --headless --port 10110 --ws-port 10430 -l 4 > /tmp/pxv1.log 2>&1 &
          PID1=$!
          nohup "$PXV_BIN" --headless --port 10111 --ws-port 10431 -l 4 > /tmp/pxv2.log 2>&1 &
          PID2=$!
          nohup "$PXV_BIN" --headless --port 10112 --ws-port 10432 -l 4 > /tmp/pxv3.log 2>&1 &
          PID3=$!

          ALL_READY=1
          wait_for_mcp 10110 $PID1 || ALL_READY=0
          wait_for_mcp 10111 $PID2 || ALL_READY=0
          wait_for_mcp 10112 $PID3 || ALL_READY=0

          if [ "$ALL_READY" -eq 1 ]; then
            echo "=== All 3 PXView instances ready, launching parallel test groups ==="
            # Run 3 test groups in parallel
            run_test_group "group1" 10110 "$GROUP1" &
            PID_T1=$!
            run_test_group "group2" 10111 "$GROUP2" &
            PID_T2=$!
            run_test_group "group3" 10112 "$GROUP3" &
            PID_T3=$!

            # Wait for all test groups to finish
            wait $PID_T1
            wait $PID_T2
            wait $PID_T3
            echo "=== All 3 test groups completed ==="
          else
            echo "ERROR: One or more PXView instances failed to start"
            echo "--- PXView1 log ---"; cat /tmp/pxv1.log 2>/dev/null || true
            echo "--- PXView2 log ---"; cat /tmp/pxv2.log 2>/dev/null || true
            echo "--- PXView3 log ---"; cat /tmp/pxv3.log 2>/dev/null || true
            echo "--- PXView real file log (~/PXView.log) ---"; cat "$HOME/PXView.log" 2>/dev/null || true
            echo "--- ldd PXView ---"; ldd "$PXV_BIN" 2>&1 | grep -i "not found" || echo "no missing shared libs"
            # Generate failure XML for all groups
            for g in group1 group2 group3; do
              echo '<?xml version="1.0" encoding="UTF-8"?>' > "$GITHUB_WORKSPACE/${g}_report.xml"
              echo "<testsuites><testsuite name=\"$g\" tests=\"0\" failures=\"0\" errors=\"1\" time=\"0\"><testcase name=\"startup-failure\"><error message=\"PXView MCP server did not start\"/></testcase></testsuite></testsuites>" >> "$GITHUB_WORKSPACE/${g}_report.xml"
            done
            echo "Failing CI step: PXView failed to start (see backtrace above)"
            exit 1
          fi

          # ---- Stop all PXView instances ----
          kill $PID1 $PID2 $PID3 2>/dev/null || true
          wait $PID1 $PID2 $PID3 2>/dev/null || true

          # ---- Merge XML reports ----
          python3 -c "
          import xml.etree.ElementTree as ET
          import glob

          merged = ET.Element('testsuites')
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_time = 0.0

          for f in sorted(glob.glob('$GITHUB_WORKSPACE/group*_report.xml')):
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  for ts in root.findall('.//testsuite'):
                      merged.append(ts)
                      total_tests += int(ts.get('tests', 0))
                      total_failures += int(ts.get('failures', 0))
                      total_errors += int(ts.get('errors', 0))
                      try:
                          total_time += float(ts.get('time', 0))
                      except ValueError:
                          pass
              except Exception as e:
                  print(f'WARNING: Failed to parse {f}: {e}')

          merged.set('tests', str(total_tests))
          merged.set('failures', str(total_failures))
          merged.set('errors', str(total_errors))
          merged.set('time', f'{total_time:.2f}')

          ET.ElementTree(merged).write('$GITHUB_WORKSPACE/test_report.xml', encoding='UTF-8', xml_declaration=True)
          print(f'Merged report: {total_tests} tests, {total_failures} failures, {total_errors} errors')
          "

          # Also merge HTML reports into a simple combined file
          python3 -c "
          import glob, os
          parts = ['<html><head><meta charset=\"utf-8\"><title>Release E2E Test Report</title></head><body>']
          parts.append('<h1>PXView Release E2E Test Report (3-way parallel)</h1>')
          for f in sorted(glob.glob('$GITHUB_WORKSPACE/group*_report.html')):
              name = os.path.basename(f).replace('_report.html', '')
              parts.append(f'<h2>{name}</h2>')
              try:
                  with open(f, 'r', encoding='utf-8') as fh:
                      content = fh.read()
                      # Extract body content
                      if '<body>' in content:
                          content = content.split('<body>', 1)[1].split('</body>', 1)[0]
                      parts.append(content)
              except Exception:
                  parts.append(f'<p>Failed to read {f}</p>')
          parts.append('</body></html>')
          with open('$GITHUB_WORKSPACE/test_report.html', 'w', encoding='utf-8') as fh:
              fh.write('\\n'.join(parts))
          "

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-report
          path: |
            test_report.html
            test_report.xml
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Release E2E Test Results
          path: 'test_report.xml'
          reporter: java-junit
          fail-on-error: 'false'

  # ============================================================
  # Job 2: ASan + UBSan Core Tests (subset)
  # ============================================================
  asan-core-tests:
    name: ASan Core Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"

    steps:
      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Python 3.14 via deadsnakes PPA
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            python3.14 python3.14-dev python3.14-venv
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.14
          python3.14 -m pip install -U setuptools
          python3.14 --version

      - name: Setup Rust toolchain (for Tauri desktop app)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev nlohmann-json3-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev \
            sdcc wget zip

      - name: Install Qt via aqtinstall
        run: |
          python3 -m pip install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets qtmultimedia --outputdir ${{ env.QT_PREFIX }}

      - name: Build qtwayland platform plugin
        run: |
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build

      - name: Configure CMake (Debug + ASan + UBSan)
        run: |
          rm -rf build && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON \
            -DENABLE_TAURI=ON \
            -DDISABLE_WERROR=ON \
            -DCMAKE_INSTALL_PREFIX=../install.dir/usr \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Build and Install PXView
        run: |
          cd build
          ninja -j $(nproc)
          ninja install
          echo "=== Installed binary ==="
          ls -la ../install.dir/usr/bin/PXView
          file ../install.dir/usr/bin/PXView

      - name: Setup Python for testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Bundle Python standard library
        run: |
          PY_VERSION=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Bundling Python $PY_VERSION standard library"
          mkdir -p install.dir/usr/lib/python$PY_VERSION
          cp -a /usr/lib/python$PY_VERSION/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          SETUP_STDLIB=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])" 2>/dev/null || true)
          if [ -n "$SETUP_STDLIB" ] && [ -d "$SETUP_STDLIB" ]; then
            cp -a "$SETUP_STDLIB"/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          fi
          mkdir -p install.dir/usr/lib/python$PY_VERSION/lib-dynload
          cp -a /usr/lib/python$PY_VERSION/lib-dynload/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          SETUP_DYNLOAD=$(python3 -c "import _struct, os; print(os.path.dirname(_struct.__file__))" 2>/dev/null || true)
          if [ -n "$SETUP_DYNLOAD" ] && [ -d "$SETUP_DYNLOAD" ]; then
            cp -a "$SETUP_DYNLOAD"/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          fi
          rm -rf install.dir/usr/lib/python$PY_VERSION/test
          rm -rf install.dir/usr/lib/python$PY_VERSION/__pycache__
          find install.dir/usr/lib/python$PY_VERSION -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Bundled Python stdlib size:"
          du -sh install.dir/usr/lib/python$PY_VERSION

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-timeout
          pip install -e ./pxview-automation

      - name: Run ASan core E2E tests (subset)
        run: |
          export ASAN_OPTIONS="detect_leaks=1:abort_on_error=0:print_stacktrace=1:halt_on_error=0"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0"
          export LD_LIBRARY_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"
          export QT_QPA_PLATFORM=offscreen

          "$PWD/install.dir/usr/bin/PXView" -l 4 &
          PXV_PID=$!
          echo "PXView PID: $PXV_PID"

          MCP_URL="http://127.0.0.1:10110/mcp"
          READY=0
          for i in $(seq 1 120); do
            if ! kill -0 $PXV_PID 2>/dev/null; then
              echo "ERROR: PXView exited prematurely"
              break
            fi
            RESP=$(curl -s -X POST "$MCP_URL" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
              --max-time 5 2>/dev/null || true)
            if echo "$RESP" | grep -q "protocolVersion"; then
              echo "MCP server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 1 ]; then
            echo "=== Running ASan core E2E test subset ==="
            echo "test_01: MCP protocol (9 tests)"
            echo "test_03: capture basic (13 tests)"
            echo "test_05: data integrity"
            cd tests
            export PXVIEW_NO_AUTO_START=1
            export PXVIEW_MCP_URL="$MCP_URL"
            export PXVIEW_STARTUP_TIMEOUT=30

            python -m pytest \
              suites/test_01_mcp_protocol.py \
              suites/test_03_capture_basic.py \
              suites/test_05_data_integrity.py \
              -v --tb=short --timeout=120 --timeout-method=thread \
              --html="$GITHUB_WORKSPACE/asan_report.html" \
              --junitxml="$GITHUB_WORKSPACE/asan_report.xml" \
              --self-contained-html \
              || echo "WARNING: Tests had failures (check ASan reports above)"

            # Fallback: ensure XML exists even if pytest crashed/timed out
            if [ ! -f "$GITHUB_WORKSPACE/asan_report.xml" ]; then
              echo '<?xml version="1.0" encoding="UTF-8"?>' > "$GITHUB_WORKSPACE/asan_report.xml"
              echo '<testsuites><testsuite name="asan-core" tests="0" failures="0" errors="1" time="0"><testcase name="pytest-crash"><error message="pytest did not generate report"/></testcase></testsuite></testsuites>' >> "$GITHUB_WORKSPACE/asan_report.xml"
              echo "WARNING: Generated fallback XML (pytest did not complete)"
            fi
          else
            echo "ERROR: MCP server did not start within 120s"
            echo '<?xml version="1.0" encoding="UTF-8"?>' > "$GITHUB_WORKSPACE/asan_report.xml"
            echo '<testsuites><testsuite name="asan-core" tests="0" failures="0" errors="1" time="0"><testcase name="startup-failure"><error message="PXView MCP server did not start"/></testcase></testsuite></testsuites>' >> "$GITHUB_WORKSPACE/asan_report.xml"
          fi

          kill $PXV_PID 2>/dev/null || true
          wait $PXV_PID 2>/dev/null || true

      - name: Upload ASan test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-core-report
          path: |
            asan_report.html
            asan_report.xml
          if-no-files-found: warn

      - name: Publish ASan test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: ASan Core Test Results
          path: 'asan_report.xml'
          reporter: java-junit
          fail-on-error: 'false'

  # ============================================================
  # Job 3: TSan Race Detection (headless + GUI)
  # ============================================================
  tsan-races:
    name: TSan Race Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"

    steps:
      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Python 3.14 via deadsnakes PPA
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            python3.14 python3.14-dev python3.14-venv
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.14
          python3.14 -m pip install -U setuptools
          python3.14 --version

      - name: Setup Rust toolchain (for Tauri desktop app)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev nlohmann-json3-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev \
            sdcc wget zip

      - name: Install Qt via aqtinstall
        run: |
          python3 -m pip install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets qtmultimedia --outputdir ${{ env.QT_PREFIX }}

      - name: Build qtwayland platform plugin
        run: |
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build

      - name: Configure CMake (Debug + TSan)
        run: |
          rm -rf build && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TSAN=ON \
            -DENABLE_TAURI=ON \
            -DDISABLE_WERROR=ON \
            -DCMAKE_INSTALL_PREFIX=../install.dir/usr \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Build and Install PXView
        run: |
          cd build
          ninja -j $(nproc)
          ninja install
          echo "=== Installed binary ==="
          ls -la ../install.dir/usr/bin/PXView
          file ../install.dir/usr/bin/PXView

      - name: Setup Python for testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Bundle Python standard library
        run: |
          PY_VERSION=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Bundling Python $PY_VERSION standard library"
          mkdir -p install.dir/usr/lib/python$PY_VERSION
          cp -a /usr/lib/python$PY_VERSION/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          SETUP_STDLIB=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])" 2>/dev/null || true)
          if [ -n "$SETUP_STDLIB" ] && [ -d "$SETUP_STDLIB" ]; then
            cp -a "$SETUP_STDLIB"/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          fi
          mkdir -p install.dir/usr/lib/python$PY_VERSION/lib-dynload
          cp -a /usr/lib/python$PY_VERSION/lib-dynload/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          SETUP_DYNLOAD=$(python3 -c "import _struct, os; print(os.path.dirname(_struct.__file__))" 2>/dev/null || true)
          if [ -n "$SETUP_DYNLOAD" ] && [ -d "$SETUP_DYNLOAD" ]; then
            cp -a "$SETUP_DYNLOAD"/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          fi
          rm -rf install.dir/usr/lib/python$PY_VERSION/test
          rm -rf install.dir/usr/lib/python$PY_VERSION/__pycache__
          find install.dir/usr/lib/python$PY_VERSION -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Bundled Python stdlib size:"
          du -sh install.dir/usr/lib/python$PY_VERSION

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-timeout
          pip install -e ./pxview-automation

      # ============================================================
      # Phase 1: TSan headless mode — MCP protocol tests
      # ============================================================
      - name: TSan Phase 1 — headless mode (MCP protocol)
        run: |
          export PXVIEW_EXE_PATH="$PWD/install.dir/usr/bin/PXView"
          export PXVIEW_STARTUP_TIMEOUT=180
          export PXVIEW_MCP_URL="http://127.0.0.1:10110/mcp"
          export TSAN_OPTIONS="halt_on_error=0:second_deadlock_stack=1"
          export LD_LIBRARY_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"

          echo "=============================================="
          echo "  TSan Phase 1: headless mode"
          echo "=============================================="

          "$PXVIEW_EXE_PATH" --headless -l 4 &
          PXV_PID=$!
          echo "PXView PID: $PXV_PID"

          READY=0
          for i in $(seq 1 180); do
            if ! kill -0 $PXV_PID 2>/dev/null; then
              echo "ERROR: PXView exited prematurely"
              break
            fi
            RESP=$(curl -s -X POST "$PXVIEW_MCP_URL" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
              --max-time 5 2>/dev/null || true)
            if echo "$RESP" | grep -q "protocolVersion"; then
              echo "MCP server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 1 ]; then
            echo "=== Running MCP protocol tests under TSan ==="
            cd tests
            python -m pytest suites/test_01_mcp_protocol.py -v \
              --tb=short --timeout=300 --timeout-method=thread \
              --html="$GITHUB_WORKSPACE/tsan_headless_report.html" \
              --junitxml="$GITHUB_WORKSPACE/tsan_headless_report.xml" \
              --self-contained-html \
              || echo "WARNING: Tests had failures (check for TSan race reports above)"
          else
            echo "ERROR: MCP server did not start within 180s"
          fi

          kill $PXV_PID 2>/dev/null || true
          wait $PXV_PID 2>/dev/null || true

      # ============================================================
      # Phase 2: TSan GUI mode (offscreen) — MCP + capture tests
      # ============================================================
      - name: TSan Phase 2 — GUI mode offscreen (MCP + capture)
        run: |
          export PXVIEW_EXE_PATH="$PWD/install.dir/usr/bin/PXView"
          export PXVIEW_STARTUP_TIMEOUT=180
          export PXVIEW_MCP_URL="http://127.0.0.1:10110/mcp"
          export TSAN_OPTIONS="halt_on_error=0:second_deadlock_stack=1"
          export LD_LIBRARY_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"
          export QT_QPA_PLATFORM=offscreen

          echo "=============================================="
          echo "  TSan Phase 2: GUI mode (offscreen)"
          echo "=============================================="

          "$PXVIEW_EXE_PATH" -l 4 &
          PXV_PID=$!
          echo "PXView PID: $PXV_PID"

          READY=0
          for i in $(seq 1 180); do
            if ! kill -0 $PXV_PID 2>/dev/null; then
              echo "ERROR: PXView exited prematurely"
              break
            fi
            RESP=$(curl -s -X POST "$PXVIEW_MCP_URL" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
              --max-time 5 2>/dev/null || true)
            if echo "$RESP" | grep -q "protocolVersion"; then
              echo "MCP server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 1 ]; then
            echo "=== Running MCP + capture tests under TSan (GUI mode) ==="
            cd tests
            python -m pytest \
              suites/test_01_mcp_protocol.py \
              suites/test_03_capture_basic.py \
              -v --tb=short --timeout=300 --timeout-method=thread \
              --html="$GITHUB_WORKSPACE/tsan_gui_report.html" \
              --junitxml="$GITHUB_WORKSPACE/tsan_gui_report.xml" \
              --self-contained-html \
              || echo "WARNING: Tests had failures (check for TSan race reports above)"
          else
            echo "ERROR: MCP server did not start within 180s (GUI mode)"
          fi

          kill $PXV_PID 2>/dev/null || true
          wait $PXV_PID 2>/dev/null || true

      - name: Upload TSan headless report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-headless-report
          path: |
            tsan_headless_report.html
            tsan_headless_report.xml
          if-no-files-found: warn

      - name: Upload TSan GUI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-gui-report
          path: |
            tsan_gui_report.html
            tsan_gui_report.xml
          if-no-files-found: warn

      - name: Publish TSan test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TSan Race Detection Results
          path: 'tsan_*_report.xml'
          reporter: java-junit
          fail-on-error: 'false'

  # ============================================================
  # Job 4: Clang-Tidy Fast (bug-finding checks only)
  #
  # 使用 .clang-tidy-ci 配置，只包含 bug-finding checks：
  #   clang-analyzer-*  : NULL deref, UAF, uninitialized
  #   bugprone-*        : common bug patterns
  #   cert-*            : security vulnerabilities
  #   concurrency-*     : thread safety
  #
  # 跳过的 checks（style/performance — 在本地用完整 .clang-tidy 跑）：
  #   cppcoreguidelines-*, misc-*, performance-*, readability-*, modernize-*
  #
  # 预计 15-20 分钟（vs 全量 57+ 分钟）
  # ============================================================
  clang-tidy-fast:
    name: Clang-Tidy (Fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write

    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"

    steps:
      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Python 3.14 via deadsnakes PPA
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            python3.14 python3.14-dev python3.14-venv
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.14
          python3.14 -m pip install -U setuptools
          python3.14 --version

      - name: Install build dependencies + clang-tidy-20
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev nlohmann-json3-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev
          # Install clang-tidy-20 from LLVM official APT repo
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-tidy-20
          sudo ln -sf /usr/bin/clang-tidy-20 /usr/local/bin/clang-tidy
          clang-tidy --version

      - name: Install Qt via aqtinstall
        run: |
          python3 -m pip install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets qtmultimedia --outputdir ${{ env.QT_PREFIX }}

      - name: Build qtwayland platform plugin
        run: |
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build

      - name: Configure CMake (Debug + Clang-Tidy CI)
        run: |
          rm -rf build && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_CLANG_TIDY=ON \
            -DCLANG_TIDY_CONFIG_FILE=${{ github.workspace }}/.clang-tidy-ci \
            -DDISABLE_WERROR=ON \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Run Clang-Tidy (fast, bug-finding only)
        run: |
          cd build
          # Clang-Tidy runs during compilation via CMAKE_CXX_CLANG_TIDY.
          # Uses .clang-tidy-ci config (only clang-analyzer + bugprone + cert + concurrency).
          # Skips readability/modernize/misc/performance/cppcoreguidelines.
          timeout 1200 ninja -j $(nproc) 2>&1 | tee clang-tidy.log || {
            echo "WARNING: Build or clang-tidy timed out after 20 minutes"
            echo "Partial results are in clang-tidy.log"
          }

          # Count warnings by category
          echo ""
          echo "=== Clang-Tidy Summary ==="
          TOTAL=$(grep -c "warning:" clang-tidy.log || echo 0)
          echo "Total warnings: $TOTAL"
          echo ""
          echo "=== Warnings by check ==="
          grep -oP '\[[-a-zA-Z0-9.]+\]' clang-tidy.log | sort | uniq -c | sort -rn | head -20
          echo ""
          echo "=== Check categories in this run ==="
          echo "  clang-analyzer-* (NULL deref, UAF, uninitialized)"
          echo "  bugprone-* (common bug patterns)"
          echo "  cert-* (security vulnerabilities)"
          echo "  concurrency-* (thread safety)"
          echo ""
          echo "Skipped (run locally with full .clang-tidy):"
          echo "  cppcoreguidelines-*, misc-*, performance-*, readability-*, modernize-*"

      - name: Upload Clang-Tidy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-fast-report
          path: build/clang-tidy.log
          if-no-files-found: warn
