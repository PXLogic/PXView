name: PAT probe (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect RELEASE_PAT shape (no value leaked)
        env:
          P: ${{ secrets.RELEASE_PAT }}
        run: |
          echo "len=${#P}"
          echo "first4=${P:0:4}"
          echo "last4=${P: -4}"
          case "$P" in *$'\r'*) echo "has_CR=yes";; *) echo "has_CR=no";; esac
          case "$P" in *$'\n'*) echo "has_LF=yes";; *) echo "has_LF=no";; esac
          case "$P" in ' '*) echo "leading_space=yes";; *) echo "leading_space=no";; esac
          case "$P" in *' '*) echo "trailing_space=yes";; *) echo "trailing_space=no";; esac
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $P" https://api.github.com/repos/PXLogic/PXView)
          echo "read_repo_http=$CODE"
          CODE2=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $P" https://api.github.com/repos/PXLogic/PXView/releases)
          echo "list_releases_http=$CODE2"
