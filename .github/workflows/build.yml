﻿name: PXView Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build (e.g. view_and_data, v1.5.4, abc123). Leave empty to use the repository default branch.'
        required: false
        default: ''
      version:
        description: 'Version number for package naming (e.g. 1.5.4)'
        required: true
        default: '1.5.7'
      targets:
        description: 'Which platforms to build (linux / mac / windows / both / all)'
        required: true
        default: 'all'
        type: choice
        options: [linux, mac, windows, both, all]
      publish_release:
        description: 'Publish build artifacts to a GitHub Release (only applies to manual runs; tag pushes always publish)'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
    branches:
      - main
      - view_and_data
  pull_request:
    branches:
      - main

jobs:
  audit:
    name: Config Type Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Init libsigrok submodule (required by audit script)
        run: git submodule update --init libsigrok

      - name: Run config key type audit
        run: python3 tools/audit_config_types.py

  linux:
    name: Linux AppImage (x86_64)
    if: ${{ github.event.inputs.targets == 'linux' || github.event.inputs.targets == 'both' || github.event.inputs.targets == 'all' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"
      LINUXDEPLOY_VERSION: "continuous"

    steps:
      - name: Resolve ref
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "${INPUT_REF}" ]; then
            REF="${INPUT_REF}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF="refs/heads/${DEFAULT_BRANCH}"
          else
            REF="${EVENT_REF}"
          fi
          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: ${REF}"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "value=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "value=1.5.7" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          # Ubuntu 24.04 自带 GCC 14,无需 PPA
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev \
            python3-dev python3-pip \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev \
            sdcc wget zip
          gcc --version
          g++ --version

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Qt via aqtinstall
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets --outputdir ${{ env.QT_PREFIX }}
          echo "=== Platform plugins before qtwayland build ==="
          ls -la ${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/plugins/platforms/ || true

      - name: Build qtwayland platform plugin
        run: |
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build
          echo "=== Platform plugins after qtwayland build ==="
          ls -la ${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/plugins/platforms/

      - name: Build fx2lafw firmware
        run: |
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        run: |
          rm -rf build && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../install.dir/usr \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Build and Install Web UI
        run: |
          export PATH="/c/Program Files/nodejs:$PATH"
          cd build && ninja install-webui

      - name: Build PXView
        run: cd build && ninja -j $(nproc)

      - name: Install
        run: cd build && ninja install

      - name: Bundle Python standard library into AppDir
        run: |
          PY_VERSION=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Bundling Python $PY_VERSION standard library"
          mkdir -p install.dir/usr/lib/python$PY_VERSION
          cp -a /usr/lib/python$PY_VERSION/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          mkdir -p install.dir/usr/lib/python$PY_VERSION/lib-dynload
          cp -a /usr/lib/python$PY_VERSION/lib-dynload/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          rm -rf install.dir/usr/lib/python$PY_VERSION/test
          rm -rf install.dir/usr/lib/python$PY_VERSION/__pycache__
          find install.dir/usr/lib/python$PY_VERSION -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          if [ -d /usr/lib/python$PY_VERSION/encodings ]; then
            echo "OK: encodings module found at /usr/lib/python$PY_VERSION/encodings"
          else
            echo "WARN: encodings not found in /usr/lib/python$PY_VERSION, AppImage Python may fail"
          fi
          echo "Bundled Python stdlib size:"
          du -sh install.dir/usr/lib/python$PY_VERSION

      - name: Bundle GCC runtime libraries into AppDir
        run: |
          # Ubuntu 24.04 自带 GCC 14,但目标用户可能在 Ubuntu 22.04 上运行,
          # 那里只有 GCC 12。打包 libstdc++.so.6 和 libgcc_s.so.1 确保
          # GLIBCXX_3.4.33 等符号在旧系统上可用。
          echo "=== Bundling GCC runtime libraries ==="
          mkdir -p install.dir/usr/lib
          STDCPP_SRC=$(gcc -print-file-name=libstdc++.so.6)
          if [ -f "$STDCPP_SRC" ]; then
            cp -f "$STDCPP_SRC" install.dir/usr/lib/
            echo "  libstdc++.so.6: $STDCPP_SRC -> install.dir/usr/lib/"
          else
            echo "  WARNING: libstdc++.so.6 not found"
          fi
          LIBGCC_SRC=$(gcc -print-file-name=libgcc_s.so.1)
          if [ -f "$LIBGCC_SRC" ]; then
            cp -f "$LIBGCC_SRC" install.dir/usr/lib/
            echo "  libgcc_s.so.1: $LIBGCC_SRC -> install.dir/usr/lib/"
          else
            echo "  WARNING: libgcc_s.so.1 not found"
          fi
          echo "=== Bundled library versions ==="
          strings install.dir/usr/lib/libstdc++.so.6 | grep GLIBCXX | tail -5
          ls -la install.dir/usr/lib/libstdc++.so.6 install.dir/usr/lib/libgcc_s.so.1

      - name: Create AppImage using linuxdeploy
        run: |
          # linuxdeploy 的 mksquashfs 需要可写的 TMPDIR (GitHub Actions 默认 /tmp 可能空间不足)
          export TMPDIR="$HOME/tmp"
          mkdir -p "$TMPDIR"
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-x86_64.AppImage"
          wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          export QMAKE="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/bin/qmake"
          export LD_LIBRARY_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"
          export OUTPUT="PXView-Linux-x86_64-AppImage-${{ steps.version.outputs.value }}.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir install.dir \
            -e install.dir/usr/bin/PXView \
            -d install.dir/usr/share/applications/pxview.desktop \
            --plugin qt \
            --output appimage

      - name: Verify AppImage
        run: |
          ls -la PXView-Linux-x86_64-AppImage-${{ steps.version.outputs.value }}.AppImage
          chmod +x PXView-Linux-x86_64-AppImage-${{ steps.version.outputs.value }}.AppImage

      - name: Package udev rules (separate artifact)
        run: |
          mkdir -p udev-rules
          cp install.dir/usr/lib/udev/rules.d/60-px.rules udev-rules/
          cp libsigrok/contrib/60-libsigrok.rules udev-rules/
          cp libsigrok/contrib/61-libsigrok-plugdev.rules udev-rules/
          cp libsigrok/contrib/61-libsigrok-uaccess.rules udev-rules/
          cat > udev-rules/install-udev-rules.sh << 'EOF'
          #!/bin/bash
          set -e
          RULES_FILES="60-px.rules 60-libsigrok.rules 61-libsigrok-plugdev.rules 61-libsigrok-uaccess.rules"
          if [ "$(id -u)" -ne 0 ]; then
            echo "Please run with sudo: sudo $0"
            exit 1
          fi
          if [ -d /usr/lib/udev/rules.d ]; then
            DEST=/usr/lib/udev/rules.d
          elif [ -d /lib/udev/rules.d ]; then
            DEST=/lib/udev/rules.d
          elif [ -d /etc/udev/rules.d ]; then
            DEST=/etc/udev/rules.d
          else
            echo "Error: No udev rules directory found"
            exit 1
          fi
          echo "Installing udev rules to $DEST/"
          for f in $RULES_FILES; do
            if [ ! -f "$f" ]; then
              echo "Warning: $f not found, skipping"
              continue
            fi
            cp "$f" "$DEST/$f"
            echo "  -> installed $f"
          done
          udevadm control --reload-rules
          udevadm trigger
          echo ""
          echo "Done. PXView hardware devices should now be accessible without sudo."
          echo "Note: For the 'plugdev' group rule to take effect, add yourself to the group:"
          echo "  sudo usermod -aG plugdev \$USER"
          echo "Then log out and back in (or run 'newgrp plugdev')."
          EOF
          chmod +x udev-rules/install-udev-rules.sh
          (cd udev-rules && zip -r ../PXView-Linux-udev-rules-${{ steps.version.outputs.value }}.zip .)
          ls -la PXView-Linux-udev-rules-${{ steps.version.outputs.value }}.zip
          echo "=== udev rules contents ==="
          unzip -l PXView-Linux-udev-rules-${{ steps.version.outputs.value }}.zip

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Linux-x86_64-AppImage-${{ steps.version.outputs.value }}
          path: PXView-Linux-x86_64-AppImage-${{ steps.version.outputs.value }}.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload udev rules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Linux-udev-rules-${{ steps.version.outputs.value }}
          path: PXView-Linux-udev-rules-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release (tag push or manual opt-in)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PXView-Linux-x86_64-AppImage-${{ steps.version.outputs.value }}.AppImage
            PXView-Linux-udev-rules-${{ steps.version.outputs.value }}.zip
          draft: true
          name: PXView ${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    name: macOS (${{ matrix.arch }})
    if: ${{ github.event.inputs.targets == 'mac' || github.event.inputs.targets == 'both' || github.event.inputs.targets == 'all' || github.event_name == 'push' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            cross_compile: false
          - arch: x86_64
            cross_compile: true
    runs-on: macos-14
    steps:
      - name: Resolve ref
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "${INPUT_REF}" ]; then
            REF="${INPUT_REF}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF="refs/heads/${DEFAULT_BRANCH}"
          else
            REF="${EVENT_REF}"
          fi
          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: ${REF}"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "value=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "value=1.5.7" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
          submodules: recursive
          persist-credentials: false

      - name: Setup x86_64 cross-compilation (Rosetta 2)
        if: matrix.cross_compile
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          if [ ! -f /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "HOMEBREW_NO_PATH_SHADOW_CHECK=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_ENV_HINTS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "=== x86_64 Homebrew 验证 ==="
          /usr/local/bin/brew --version

      - name: Install dependencies via Homebrew
        run: |
          brew update
          if [ "${{ matrix.cross_compile }}" = "true" ]; then
            BREW_OVERWRITE="--overwrite"
          else
            BREW_OVERWRITE=""
          fi
          brew install $BREW_OVERWRITE cmake ninja gettext glib libusb zlib boost fftw python3 qt pkg-config libzip nettle libftdi sdcc

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build fx2lafw firmware
        run: |
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        run: |
          rm -rf build && mkdir -p build && cd build
          export LDFLAGS="-L$(brew --prefix gettext)/lib"
          export CPPFLAGS="-I$(brew --prefix gettext)/include"
          export PKG_CONFIG_PATH="$(brew --prefix gettext)/lib/pkgconfig:$PKG_CONFIG_PATH"
          if [ "${{ matrix.cross_compile }}" = "true" ]; then
            OSX_ARCH_FLAG="-DCMAKE_OSX_ARCHITECTURES=x86_64"
          else
            OSX_ARCH_FLAG=""
          fi
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            $OSX_ARCH_FLAG \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_INSTALL_PREFIX=../install.dir

      - name: Build and Package Web UI
        run: cd build && ninja && ninja install-webui

      - name: Install
        run: cd build && ninja install

      - name: Create DMG using macdeployqt
        run: |
          MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"

          # Python framework 路径修正
          PY_PREFIX="$(brew --prefix python3 2>/dev/null \
                       || brew --prefix python@3.14 2>/dev/null \
                       || brew --prefix python@3.13 2>/dev/null \
                       || brew --prefix python@3.12 2>/dev/null)"
          if [ -n "$PY_PREFIX" ]; then
            mkdir -p "$PY_PREFIX/lib"
            if [ ! -e "$PY_PREFIX/lib/Python.framework" ] && [ -e "$PY_PREFIX/Frameworks/Python.framework" ]; then
              ln -s "$PY_PREFIX/Frameworks/Python.framework" "$PY_PREFIX/lib/Python.framework"
            fi
          fi

          # macdeployqt 依赖收集
          echo "=== macdeployqt (依赖收集) ==="
          SECS_START=$SECONDS
          $MACDEPLOYQT install.dir/PXView.app \
            -always-overwrite -verbose=1 \
            || true
          echo "macdeployqt 耗时: $((SECONDS - SECS_START))s"

          # 预先从 Homebrew 复制 macdeployqt 报错说找不到的三个 dylib
          BREW_LIB="$(brew --prefix)/lib"
          mkdir -p install.dir/PXView.app/Contents/Frameworks
          for dep in libbrotlicommon.1.dylib libsharpyuv.0.dylib libwebp.7.dylib; do
            real_path="$(readlink -f "$BREW_LIB/$dep" 2>/dev/null || echo "$BREW_LIB/$dep")"
            if [ -f "$real_path" ]; then
              real_name="$(basename "$real_path")"
              cp -f "$real_path" install.dir/PXView.app/Contents/Frameworks/"$real_name"
              if [ "$real_name" != "$dep" ]; then
                rm -f install.dir/PXView.app/Contents/Frameworks/"$dep"
                ln -s "$real_name" install.dir/PXView.app/Contents/Frameworks/"$dep"
              fi
              install_name_tool -id "@rpath/$dep" install.dir/PXView.app/Contents/Frameworks/"$real_name"
            fi
          done

          # ── 复制 Python 标准库到 bundled Python.framework ──
          echo "=== 复制 Python stdlib ==="
          BUNDLED_FW="install.dir/PXView.app/Contents/Frameworks/Python.framework"
          if [ -d "$BUNDLED_FW" ]; then
            for ver_dir in "$BUNDLED_FW"/Versions/3.*; do
              [ -d "$ver_dir" ] || continue
              py_ver=$(basename "$ver_dir")
              STDLIB_SRC=""
              for fw_base in \
                "$PY_PREFIX/Frameworks/Python.framework" \
                "$PY_PREFIX/lib/Python.framework" \
                "$(brew --prefix)/Frameworks/Python.framework"; do
                if [ -d "$fw_base/Versions/$py_ver/lib/python$py_ver/encodings" ]; then
                  STDLIB_SRC="$fw_base/Versions/$py_ver/lib/python$py_ver"
                  break
                fi
              done
              if [ -z "$STDLIB_SRC" ]; then
                for candidate in "$(brew --prefix)/lib/python$py_ver" "$PY_PREFIX/lib/python$py_ver"; do
                  if [ -d "$candidate/encodings" ]; then
                    STDLIB_SRC="$candidate"
                    break
                  fi
                done
              fi
              if [ -n "$STDLIB_SRC" ]; then
                mkdir -p "$ver_dir/lib"
                cp -R "$STDLIB_SRC" "$ver_dir/lib/"
                echo "Copied Python stdlib (python$py_ver from $STDLIB_SRC) to bundled framework"
                if [ -d "$ver_dir/lib/python$py_ver/encodings" ]; then
                  echo "Verified: encodings module present"
                else
                  echo "WARNING: encodings module missing after copy"
                fi
              else
                echo "WARNING: Python stdlib not found for $py_ver"
              fi
            done
            find "$BUNDLED_FW" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
            if [ ! -e "$BUNDLED_FW/Versions/Current" ]; then
              latest_ver=$(ls -d "$BUNDLED_FW"/Versions/3.* 2>/dev/null | sort -V | tail -1)
              if [ -n "$latest_ver" ]; then
                ln -s "$(basename "$latest_ver")" "$BUNDLED_FW/Versions/Current"
                echo "Created Current symlink -> $(basename "$latest_ver")"
              fi
            fi
          else
            echo "WARNING: Python.framework not found in bundle"
          fi

          # 清除隔离标记
          xattr -cr install.dir/PXView.app 2>/dev/null || true

          # ── 逐层签名 (Apple 推荐方式,替代 --deep) ──
          # 顺序: Frameworks → PlugIns → 可执行文件 → .app bundle
          echo "=== codesign (逐层签名) ==="
          SECS_CS=$SECONDS
          APP="install.dir/PXView.app"

          # 1. Frameworks (最底层依赖)
          echo "  [1/4] Signing Frameworks..."
          find "$APP/Contents/Frameworks" -type f -name '*.dylib' -print0 2>/dev/null | \
            while IFS= read -r -d '' dylib; do
              codesign --force --sign - "$dylib" 2>/dev/null || true
            done
          # Framework bundles (.framework directories)
          find "$APP/Contents/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 2>/dev/null | \
            while IFS= read -r -d '' fw; do
              codesign --force --sign - "$fw" 2>/dev/null || true
            done

          # 2. PlugIns
          if [ -d "$APP/Contents/PlugIns" ]; then
            echo "  [2/4] Signing PlugIns..."
            find "$APP/Contents/PlugIns" -type f -name '*.so' -print0 2>/dev/null | \
              while IFS= read -r -d '' plugin; do
                codesign --force --sign - "$plugin" 2>/dev/null || true
              done
            find "$APP/Contents/PlugIns" -maxdepth 1 -type d -print0 2>/dev/null | \
              while IFS= read -r -d '' plugin_dir; do
                [ "$plugin_dir" = "$APP/Contents/PlugIns" ] && continue
                codesign --force --sign - "$plugin_dir" 2>/dev/null || true
              done
          else
            echo "  [2/4] No PlugIns directory, skipping"
          fi

          # 3. 主可执行文件
          echo "  [3/4] Signing executable..."
          codesign --force --sign - "$APP/Contents/MacOS/PXView" 2>/dev/null || true

          # 4. .app bundle (最外层,最后签)
          echo "  [4/4] Signing .app bundle..."
          codesign --force --sign - "$APP" 2>/dev/null || true

          echo "codesign 耗时: $((SECONDS - SECS_CS))s"

          # 验证签名
          echo "=== 验证签名 ==="
          if ! codesign --verify --strict "$APP" 2>&1; then
            echo "ERROR: codesign verification failed"
            echo "=== Diagnostic: libbrotlicommon.1.dylib ==="
            ls -la "$APP/Contents/Frameworks/libbrotlicommon"* 2>/dev/null || true
            codesign -dvvv "$APP/Contents/Frameworks/libbrotlicommon.1.dylib" 2>&1 || true
            echo "=== All Frameworks ==="
            ls -la "$APP/Contents/Frameworks/"
            exit 1
          fi
          echo "签名验证通过"

          # 签名完成后生成 dmg
          echo "=== hdiutil (DMG 生成) ==="
          SECS_HD=$SECONDS
          hdiutil create -volname PXView -srcfolder install.dir/PXView.app \
            -ov -format UDZO "install.dir/PXView-macOS-${{ matrix.arch }}-${{ steps.version.outputs.value }}.dmg"
          echo "hdiutil 耗时: $((SECONDS - SECS_HD))s"
          ls -la install.dir/*.dmg

      - name: Verify DMG (headless launch test)
        run: |
          set -e

          hdiutil attach "install.dir/PXView-macOS-${{ matrix.arch }}-${{ steps.version.outputs.value }}.dmg" -nobrowse -mountpoint /tmp/vrf-mount
          rm -rf /tmp/PXView-vrf.app
          cp -R /tmp/vrf-mount/PXView.app /tmp/PXView-vrf.app
          hdiutil detach /tmp/vrf-mount
          xattr -cr /tmp/PXView-vrf.app

          APP_BIN="/tmp/PXView-vrf.app/Contents/MacOS/PXView"
          FW="/tmp/PXView-vrf.app/Contents/Frameworks"

          echo "=== 1. 二进制架构 ==="
          file "$APP_BIN"
          lipo -info "$APP_BIN" 2>/dev/null || true

          echo ""
          echo "=== 2. @rpath 依赖检查(主二进制) ==="
          MISS=0
          while IFS= read -r ln; do
            lib=$(echo "$ln" | sed 's/^[[:space:]]*//' | awk '{print $1}')
            nm="${lib#@rpath/}"
            if [ ! -f "$FW/$nm" ]; then
              echo "  缺失: $lib"
              MISS=$((MISS+1))
            fi
          done < <(otool -L "$APP_BIN" | grep '@rpath/')
          if [ "$MISS" -gt 0 ]; then
            echo "错误: $MISS 个 @rpath 依赖未在 Frameworks 中找到"
            exit 1
          fi
          echo "  主二进制所有 @rpath 依赖已解析"

          echo ""
          echo "=== 3. Python stdlib 检查 ==="
          PY_FW="$FW/Python.framework"
          if [ -d "$PY_FW" ]; then
            found_stdlib=false
            for ver_dir in "$PY_FW"/Versions/3.*; do
              [ -d "$ver_dir" ] || continue
              py_ver=$(basename "$ver_dir")
              if [ -d "$ver_dir/lib/python$py_ver/encodings" ]; then
                found_stdlib=true
                echo "通过: Python stdlib (python$py_ver) 已打包, encodings 模块存在"
                break
              fi
            done
            if [ "$found_stdlib" = false ]; then
              echo "错误: Python.framework 存在但 stdlib 缺失"
              echo "应用在无 Homebrew Python 的机器上会崩溃"
              echo "=== Python.framework 目录结构 ==="
              find "$PY_FW" -maxdepth 4 -type d 2>/dev/null | head -30
              exit 1
            fi
          else
            echo "警告: 未找到 Python.framework (可能使用系统 Python)"
          fi

          echo ""
          echo "=== 4. headless 启动测试 ==="
          echo "PXView --headless 模式使用 QCoreApplication(无需 GUI),"
          echo "但仍会加载 libsigrok、libsigrokdecode、Python framework、"
          echo "所有协议解码器,并启动 MCP(10110)/WS(10430) API 服务。"
          echo "如果任何 dylib 缺失或损坏,进程会立即崩溃。"
          echo ""
          echo "启动 PXView --headless,等待 15 秒..."

          if [ "${{ matrix.cross_compile }}" = "true" ]; then
            arch -x86_64 "$APP_BIN" --headless -l 4 > /tmp/pxv-headless.log 2>&1 &
          else
            "$APP_BIN" --headless -l 4 > /tmp/pxv-headless.log 2>&1 &
          fi
          PID=$!
          sleep 15

          if kill -0 "$PID" 2>/dev/null; then
            echo "通过: 进程存活 15 秒 — 所有库加载成功"
            if lsof -iTCP:10110 -sTCP:LISTEN -P 2>/dev/null | grep -q LISTEN; then
              echo "通过: MCP 端口 10110 正在监听"
            else
              echo "警告: MCP 端口 10110 未监听(可能仍在初始化)"
            fi
            if lsof -iTCP:10430 -sTCP:LISTEN -P 2>/dev/null | grep -q LISTEN; then
              echo "通过: WebSocket 端口 10430 正在监听"
            else
              echo "警告: WS 端口 10430 未监听(可能仍在初始化)"
            fi
            echo ""
            echo "=== 应用输出(前 20 行) ==="
            head -20 /tmp/pxv-headless.log 2>/dev/null || true
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "失败: 进程在 15 秒内退出"
            EXIT_CODE=0
            wait "$PID" 2>/dev/null || EXIT_CODE=$?
            echo "退出码: $EXIT_CODE"
            echo ""
            echo "=== 应用输出日志 ==="
            cat /tmp/pxv-headless.log 2>/dev/null || true
            echo ""
            echo "=== 崩溃报告 ==="
            ls -lt ~/Library/Logs/DiagnosticReports/PXView* 2>/dev/null | head -5 || echo "未找到崩溃日志"
            cat ~/Library/Logs/DiagnosticReports/PXView*.crash 2>/dev/null | head -80 || true
            exit 1
          fi

          echo ""
          echo "=== ✅ DMG 验证通过 (${{ matrix.arch }}) ==="

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-macOS-${{ matrix.arch }}-${{ steps.version.outputs.value }}
          path: install.dir/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release (tag push or manual opt-in)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          files: install.dir/*.dmg
          draft: true
          name: PXView ${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows x86_64 (MinGW)
    if: ${{ github.event.inputs.targets == 'windows' || github.event.inputs.targets == 'all' || github.event_name == 'push' }}
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-nettle
            mingw-w64-x86_64-libftdi
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-lcms2
            zip
            unzip

      - name: Resolve ref
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "${INPUT_REF}" ]; then
            REF="${INPUT_REF}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF="refs/heads/${DEFAULT_BRANCH}"
          else
            REF="${EVENT_REF}"
          fi
          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: ${REF}"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "value=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "value=1.5.7" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PXView repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build fx2lafw firmware
        run: |
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../install.dir \
            -DNPM_EXECUTABLE="/c/Program Files/nodejs/npm.cmd"

      - name: Build and Install Web UI
        run: |
          export PATH="/c/Program Files/nodejs:$PATH"
          cd build && ninja install-webui

      - name: Build PXView
        run: cd build && ninja -j $(nproc)

      - name: Install
        run: cd build && ninja install

      - name: Download Python embeddable package
        shell: msys2 {0}
        run: |
          PYVER=$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')
          echo "MSYS2 Python version: $PYVER"
          URL="https://www.python.org/ftp/python/$PYVER/python-$PYVER-embed-amd64.zip"
          echo "Downloading: $URL"
          curl -L -o python/python-embed.zip "$URL"
          cd python
          unzip -o python-embed.zip
          rm -f python-embed.zip
          echo "=== Python embeddable files ==="
          ls -la *.dll *.zip *.pyd 2>/dev/null || echo "No binary files found"

      - name: Package (bundle DLLs and resources)
        run: |
          chmod +x window/copy-deps.sh
          bash window/package.sh

      - name: Verify Python DLL in package
        run: |
          echo "=== Verifying Python runtime in package/ ==="
          # Check for MinGW Python DLL (libpython3.XX.dll — correct naming)
          PY_DLL=$(ls package/libpython3*.dll 2>/dev/null | head -1)
          if [ -z "$PY_DLL" ]; then
            # Check for python.org MSVC Python DLL (python3XX.dll — wrong)
            MSVC_DLL=$(ls package/python3*.dll 2>/dev/null | grep -v python3._pth | head -1)
            if [ -n "$MSVC_DLL" ]; then
              echo "ERROR: Found python.org MSVC Python DLL: $MSVC_DLL"
              echo "       PXView.exe was linked against MSVC Python, not MinGW Python."
              echo "       Check deps.cmake MSYS2 detection and CMake configure output."
              exit 1
            fi
            echo "ERROR: No Python DLL found in package/"
            echo "Available DLLs:"
            ls package/*.dll 2>/dev/null | head -20
            exit 1
          fi
          echo "OK: Python DLL found: $(basename $PY_DLL)"

          # Check for Python stdlib (encodings module is required for startup)
          PY_VER=$(echo "$PY_DLL" | grep -oE '3\.[0-9]+')
          if [ -d "package/lib/python${PY_VER}/encodings" ]; then
            echo "OK: Python stdlib found (lib/python${PY_VER}/encodings/ exists)"
          else
            echo "ERROR: Python stdlib not found or encodings module missing"
            echo "Expected: package/lib/python${PY_VER}/encodings/"
            echo "Contents of package/lib/:"
            ls -la package/lib/ 2>/dev/null || echo "  package/lib/ does not exist"
            exit 1
          fi

          # Check for libffi (required by _ctypes.pyd)
          if [ -f "package/libffi-8.dll" ] || [ -f "package/libffi-7.dll" ]; then
            echo "OK: libffi DLL found"
          else
            echo "WARNING: libffi DLL not found (ctypes may fail)"
          fi
          echo "=== Python runtime verification passed ==="

      - name: Create NSIS installer
        shell: pwsh
        run: |
          $installer = "PXView-Windows-x86_64-Setup-${{ steps.version.outputs.value }}.exe"
          makensis "/DPRODUCT_VERSION=${{ steps.version.outputs.value }}" window_nisi.nsi
          if (Test-Path $installer) {
            Write-Host "Installer created: $installer"
            Get-Item $installer | Format-List Name, Length, LastWriteTime
          } else {
            Write-Error "NSIS installer not found: $installer"
            exit 1
          }

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Windows-x86_64-Setup-${{ steps.version.outputs.value }}
          path: PXView-Windows-x86_64-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Windows-x86_64-Portable-${{ steps.version.outputs.value }}
          path: package/
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release (tag push or manual opt-in)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PXView-Windows-x86_64-Setup-${{ steps.version.outputs.value }}.exe
          draft: true
          name: PXView ${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
