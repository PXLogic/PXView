#===============================================================================
#= macOS 崩溃诊断工作流 (lldb backtrace, 复用 build.yml 的 DMG)
#-------------------------------------------------------------------------------
# 目的: 取回「PXView Build」最近一次构建出的 macOS DMG, 在本地(机器)挂载后
#       用 lldb 跑 headless 启动测试, 在崩溃点自动抓取调用堆栈。
#
# 为什么用 lldb 而不是 gdb:
#   - macOS 上 gdb 需要额外 codesign, 且非 Apple 分发, 基本不可用;
#   - lldb 是 Apple 官方 (clang/LLVM) 调试器, macos-15 runner 自带。
#
# 产物来源 (2026-09-26 重构):
#   本工作流 **不再自行编译**, 而是复用 build.yml 的产物 —— 结构参照
#   release-ci.yml 的 publish-nightly: 用 `gh run list --workflow build.yml`
#   定位 run, 再用 actions/download-artifact@v8 拉取 macOS artifact。
#   好处: 省掉 Homebrew + ninja + macdeployqt 的整套编译(约 40 分钟),
#         job 只剩「下载 → 挂载 → lldb → 上传」。
#
#   ⚠️ 代价(务必知悉): build.yml 打包用的是 **Release** 编译, 二进制里没有
#      DWARF 调试信息。因此 lldb 里:
#        - 函数名靠 Mach-O 动态符号表仍能解析 (能定位到具体函数);
#        - **没有**源码文件:行号, 也读不到局部变量 (frame variable 会是空);
#        - 静态函数/匿名命名空间内的函数可能显示为无符号(裸地址)。
#      这与本工作流原先自行 RelWithDebInfo 编译时的体验不同。如果某次崩溃
#      必须精确到行号/局部变量, 请改用手动触发 build.yml 时指定带符号的构建,
#      或临时恢复一个 RelWithDebInfo 编译分支。
#
# 触发方式:
#   - 手动: Actions → 选本工作流 → Run workflow
#     run_id  : 留空 = 取 build.yml 最新一次 run; 也可填具体 run 的 ID
#     ref     : 拉取产物时 checkout 的 ref (仅用于日志/比对, 不影响产物)
#     wait_seconds: 不崩溃时等多久后 SIGTERM 收尾 (0 = 一直等)
#===============================================================================

name: macOS Debug (lldb backtrace)

# 默认不自动触发：本工作流会占用 macos-15 runner 跑 lldb（虽然不再编译，
# 但下载 ~130MB DMG + 挂载 + 运行仍需数分钟）。需要时手动 dispatch。
# 如需恢复 push 触发，把下面注释掉的 push 段恢复即可。
on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build.yml 的 run ID (留空 = 最近一次 PXView Build)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/commit SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''
      wait_seconds:
        description: 'Seconds to wait for the crash before SIGTERM (0 = wait forever)'
        required: false
        type: number
        default: 30

jobs:
  macos-debug:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read     # 读取 build.yml 的 run 与 artifacts
    steps:
      # ── 1. 定位 build.yml 的 run ────────────────────────────────
      # 与 release-ci.yml 的 publish-nightly 同一套做法: 不 checkout 也能查,
      # 但 gh 命令必须显式带 --repo (没有 git remote 可推断仓库)。
      # 注意这里**不做**「等它跑完」的门槛: 本工作流是事后诊断, 只要产物存在
      # 就能用; run 还没结束 / 失败了也无妨, 缺 artifact 时下一步会明确报错。
      - name: Resolve source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
            echo "使用手动指定的 run: ${RUN_ID}"
          else
            # 默认按创建时间倒序 → 第一条即最近一次 PXView Build。
            # 不过滤 conclusion: 失败的 run 也可能已经上传了 macOS artifact,
            # 诊断时恰恰可能是想看它。
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
                       --workflow build.yml --limit 1 \
                       --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "ERROR: 找不到任何 PXView Build 的 run。" >&2
              echo "       先跑一次 build.yml(至少完成 macOS 平台), 或手动填写 run_id。" >&2
              exit 1
            fi
            echo "自动选中最近一次 build.yml run: ${RUN_ID}"
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          # 附带输出该 run 的元信息, 方便在日志里核对「拿的到底是哪次构建」
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json displayTitle,headBranch,headSha,status,conclusion,createdAt \
            --template '{{.displayTitle}}{{"\n"}}branch={{.headBranch}} sha={{.headSha}}{{"\n"}}status={{.status}} conclusion={{.conclusion}}{{"\n"}}created={{.createdAt}}{{"\n"}}' \
            2>/dev/null || echo "(无法读取 run 元信息, 继续)"

      # ── 2. 取回 macOS artifact ──────────────────────────────────
      # artifact 名形如 PXView-macOS-<arch>-<version> (见 build.yml 的
      # "Upload DMG Artifact"), 内容是 install.dir/*.dmg 单文件。
      # pattern 用 **-ARM64- 精确段**, 不写 PXView-macOS-*: 后者会把将来任何
      # 以 PXView-macOS 开头的 artifact 一起拉下来(如新增 x86_64 矩阵项),
      # 且下面对 DMG 的挑选就成了不确定的目录遍历顺序。
      # merge-multiple=false(默认) → 每个 artifact 解到 dl/<artifact-name>/。
      - name: Download macOS DMG from that run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.src.outputs.run_id }}
          pattern: PXView-macOS-ARM64-*
          path: dl
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate DMG
        id: dmg
        run: |
          set -e
          echo "=== 下载到的文件 ==="
          find dl -type f -print | head -20

          # 收集全部 .dmg。矩阵扩了 arch 时这里会有多个 —— 与其静默取第一个
          # (顺序不确定, 可能拿到非预期的架构), 不如直接报错让人显式指定 run。
          # bash 3.2(macOS 自带) 没有 mapfile/readarray, 用 find 计数即可。
          COUNT=$(find dl -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: 在 run ${{ steps.src.outputs.run_id }} 的 artifact 里没找到 .dmg。" >&2
            echo "       可能那次 build 的 macOS 平台没跑、或失败在打包前。" >&2
            echo "       已下载内容:" >&2
            ls -R dl 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: 找到 ${COUNT} 个 .dmg, 无法确定用哪一个:" >&2
            find dl -type f -name '*.dmg' >&2
            echo "       请改用 workflow_dispatch 的 run_id 指定一次只含单个 arch 的构建。" >&2
            exit 1
          fi

          DMG=$(find dl -type f -name '*.dmg')
          echo "DMG = ${DMG} ($(du -h "$DMG" | cut -f1))"
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"

      # ── 3. checkout（仅为拿到诊断辅助脚本/版本文件, 非必需构建）──
      - name: Checkout PXView repo (for diagnostics only)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: false
          persist-credentials: false

      # ── 4. 挂载 DMG, 取出 .app ─────────────────────────────────
      - name: Mount DMG and extract .app
        run: |
          set -e
          DMG="${{ steps.dmg.outputs.path }}"
          MOUNT=/tmp/pxv-dmg-mount
          APP_SRC=/tmp/PXView-dbg.app

          # 同名卷残留会导致 "Resource busy" —— 先清理
          if [ -d "$MOUNT" ]; then
            hdiutil detach "$MOUNT" -force 2>/dev/null || true
          fi
          if [ -d "/Volumes/PXView" ]; then
            hdiutil detach "/Volumes/PXView" -force 2>/dev/null || true
          fi

          rm -rf "$MOUNT" "$APP_SRC"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"

          echo "=== DMG 内容 ==="
          ls "$MOUNT"

          if [ ! -d "$MOUNT/PXView.app" ]; then
            echo "ERROR: DMG 里没有 PXView.app" >&2
            ls -la "$MOUNT" >&2
            hdiutil detach "$MOUNT" -force || true
            exit 1
          fi

          # 拷到 /tmp 再 detach: 直接从挂载点跑会因镜像卸载而失败,
          # 且 DMG 内的文件带 quarantine/只读属性, lldb 需要可写目录。
          cp -R "$MOUNT/PXView.app" "$APP_SRC"
          # detach 失败不该让 step 失败(后续步骤不依赖它, runner 用完即弃);
          # 但失败的残留挂载会影响后面重跑, 所以打印出来。
          if ! hdiutil detach "$MOUNT" -force; then
            echo "WARNING: detach ${MOUNT} 失败(镜像可能仍挂载)" >&2
          fi

          if [ ! -x "$APP_SRC/Contents/MacOS/PXView" ]; then
            echo "ERROR: 拷出的 bundle 里 PXView 不可执行 —— 拷贝不完整?" >&2
            ls -la "$APP_SRC/Contents/MacOS/" >&2
            exit 1
          fi

          # 去隔离标记 —— 从下载/挂载来的 app 不带这一步会在启动时被 Gatekeeper
          # 拦掉; DMG 里的签名是 ad-hoc, xattr -cr 后仍可运行。
          xattr -cr "$APP_SRC" 2>/dev/null || true

          # 签名自检: 签名坏掉时 lldb 里会先刷一屏 dyld 错误才崩, 很难判读。
          # 在这里先说清楚, 免得把「包是坏的」误诊成「程序有 bug」。
          echo ""
          echo "=== codesign 自检 ==="
          if codesign --verify --strict "$APP_SRC" 2>&1; then
            echo "  签名验证通过"
          else
            echo "  ⚠️ 签名验证未通过(ad-hoc/CI 打包常见, 不影响 lldb 断点;"
            echo "     但若后续 lldb 里出现 dyld 库加载失败, 优先怀疑这里)"
            codesign -dvvv "$APP_SRC" 2>&1 | head -20 || true
          fi
          echo "  Gateway 评估(仅供参考): $(spctl -a -vvv "$APP_SRC" 2>&1 | head -3 | tr '\n' ' ' || true)"

          echo ""
          echo "=== .app 结构 ==="
          ls "$APP_SRC/Contents/MacOS/"
          echo "--- Frameworks (前 20) ---"
          ls "$APP_SRC/Contents/Frameworks/" 2>/dev/null | head -20
          echo ""
          echo "=== 二进制架构 ==="
          file "$APP_SRC/Contents/MacOS/PXView"
          lipo -info "$APP_SRC/Contents/MacOS/PXView" 2>/dev/null || true

          # 符号自查: 直接告诉用户这次能拿到多少信息, 免得对着一堆裸地址猜。
          # 判据只有一条 —— `dwarfdump --debug-line` 里是否有 .debug_line 段:
          #   * `dwarfdump --uuid` 不能用, 每个 Mach-O 都有 UUID, 恒为真;
          #   * `grep -c` 计数为 0 时返回 1, 在 set -e 下会中止 step → 用 `|| true`
          #     兜住(不要为此整段关 set -e, 那会放过真正的错误)。
          echo ""
          echo "=== 调试符号自查 ==="
          if command -v dwarfdump >/dev/null 2>&1; then
            DWARF_LINES=$( { dwarfdump --debug-line "$APP_SRC/Contents/MacOS/PXView" 2>/dev/null \
                             | grep -c '0x'; } || true )
            DWARF_LINES=${DWARF_LINES:-0}
            if [ "$DWARF_LINES" -gt 100 ] 2>/dev/null; then
              echo "  含 DWARF 行号信息 (${DWARF_LINES} 条) —— 堆栈可显示源码位置"
            else
              echo "  ⚠️ 无/极少 DWARF 行号信息 (${DWARF_LINES} 条)"
              echo "     预期如此: build.yml 用 Release 编译。堆栈只有函数名, 无行号/局部变量。"
            fi
            NL_SYMS=$( { nm -U "$APP_SRC/Contents/MacOS/PXView" 2>/dev/null | grep -c ' T '; } || true )
            echo "  文本段外部符号: ${NL_SYMS:-0} 个 (供函数名解析)"
          else
            echo "  ⚠️ 无 dwarfdump, 跳过自查"
          fi

      # ── 5. lldb batch 跑 headless, 崩溃即抓堆栈 ────────────────
      - name: Run headless under lldb and capture crash backtrace
        env:
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || 30 }}
        run: |
          set +e
          APP_BIN="/tmp/PXView-dbg.app/Contents/MacOS/PXView"

          echo "=== lldb (batch) headless 启动 + 崩溃堆栈采集 ==="
          echo "等待崩溃: ${WAIT_SECONDS}s (超过后 SIGTERM 收尾)"

          # lldb batch 关键点 (与旧版一致, 都是有踩坑换来的):
          #  1. 用 `run <args>` 透传 argv (settings set target.run-args 对空格参数报错)
          #  2. 崩溃(signal stop)后,lldb batch 不会继续执行 -o 命令 —— 必须用
          #     -k (on-crash) 命令,它们只在进程崩溃时执行。
          #  3. -k 命令出错会中断后续命令(stop-on-error),所以每条必须合法:
          #     - 本 lldb 版本不支持 `bt all -s`,只能用 `bt all`
          #  4. frame #0 是 static 函数时符号表无名,必须用 image lookup --address
          #     (走 DWARF)解析真实函数名; $pc/$lr 分别给出崩溃函数与调用者。
          lldb --batch \
            -o "run --headless -l 4" \
            -k "image lookup --address \$pc" \
            -k "image lookup --address \$lr" \
            -k "bt all" \
            -k "register read pc lr x8 x9 x10 x11" \
            -k "frame variable" \
            -o "quit" \
            "$APP_BIN" > /tmp/lldb-headless.log 2>&1 &
          LLDB_PID=$!
          KILLER_PID=""

          # 若应用不崩溃,到点后给 PXView 发 SIGTERM,让 lldb 的 run 返回
          if [ "${WAIT_SECONDS:-30}" -gt 0 ] 2>/dev/null; then
            (
              sleep "$WAIT_SECONDS"
              pkill -TERM -x PXView 2>/dev/null || true
            ) &
            KILLER_PID=$!
          fi

          wait "$LLDB_PID"
          LLDB_RC=$?
          if [ -n "$KILLER_PID" ]; then
            kill "$KILLER_PID" 2>/dev/null || true
          fi

          echo "lldb exit code: $LLDB_RC"
          echo ""
          echo "=== lldb 输出 (含崩溃堆栈) ==="
          cat /tmp/lldb-headless.log
          echo ""
          echo "=== 关键摘要 (帧/符号化/寄存器) ==="
          grep -nE "frame #[0-9]|Summary:|Name:|stop reason|register read|General Purpose" /tmp/lldb-headless.log | head -120
          echo ""
          echo "=== 崩溃报告 .ips (若有) ==="
          ls -lt ~/Library/Logs/DiagnosticReports/PXView-*.ips 2>/dev/null | head -3 || echo "无 .ips 崩溃报告"

          # 收集诊断产物。也把 .app 里的 PXView.log 一起收走 —— headless
          # 启动失败的线索常常在应用日志里而不在 lldb 输出里。
          mkdir -p /tmp/diag
          cp /tmp/lldb-headless.log /tmp/diag/lldb-headless.log 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/PXView-*.ips /tmp/diag/ 2>/dev/null || true
          cp "$HOME/Library/Logs/PXlogicV20/PXView/PXView.log" /tmp/diag/PXView.log 2>/dev/null || true
          cp "$HOME/AppData/Roaming/PXlogicV20/PXView/PXView.log" /tmp/diag/PXView.log 2>/dev/null || true
          ls -la /tmp/diag/

      # ── 6. 上传诊断产物 ────────────────────────────────────────
      - name: Upload lldb backtrace artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lldb-backtrace-${{ steps.src.outputs.run_id }}
          path: |
            /tmp/diag/*.log
            /tmp/diag/*.ips
          if-no-files-found: warn
