#===============================================================================
#= macOS 崩溃调试工作流 (lldb backtrace)
#-------------------------------------------------------------------------------
# 目的: 在 macOS (arm64) 上构建,然后用 lldb 运行 headless 启动测试,
#       在崩溃点自动抓取完整调用堆栈 (bt all + 崩溃帧符号化)。
#
# 为什么用 lldb 而不是 gdb:
#   - macOS 上 gdb 需要额外 codesign,且非 Apple 分发,基本不可用;
#   - lldb 是 Apple 官方 (clang/LLVM) 调试器,macos-15 runner 自带。
#
# 触发方式:
#   - 推荐: push 到 main 分支即自动构建并抓取崩溃堆栈(无需手动操作)
#   - 也支持手动: Actions → 选本工作流 → Run workflow,可指定 ref/build_type
#===============================================================================

name: macOS Debug (lldb backtrace)

# 默认不自动构建：本工作流需在 macOS runner 上完整编译 PXView 再跑 lldb，
# 成本高。改为仅 manual dispatch 时构建并上传 backtrace 产物；
# push 到 main 不再自动触发（避免每次提交都占用 macos-15 runner）。
# 如需恢复自动构建，把下面注释掉的 push 段恢复即可。
on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit SHA to build (empty = default branch)'
        required: false
        type: string
        default: ''
      build_type:
        description: 'CMake build type (symbols matter for a useful backtrace)'
        required: false
        type: choice
        default: 'RelWithDebInfo'
        options:
          - RelWithDebInfo
          - Release
          - Debug
      wait_seconds:
        description: 'Seconds to wait for the crash before SIGTERM (0 = wait forever)'
        required: false
        type: number
        default: 30

jobs:
  macos-debug:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Resolve ref
        id: ref
        run: |
          INPUT_REF="${{ github.event.inputs.ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "value=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved ref: $(cat "$GITHUB_OUTPUT" | grep value | cut -d= -f2)"

      - name: Checkout PXView repo
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.value }}
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies via Homebrew
        run: |
          # Homebrew 6.0 起 tap trust 已是默认行为，HOMEBREW_NO_REQUIRE_TAP_TRUST
          # 于 2027-12-11 移除；继续设置只会打 deprecation 警告。本项目安装的全部是
          # homebrew/core 官方 formula（官方 tap 永远受信任），无需关闭任何信任校验。
          #
          # runner 镜像自带一些与构建无关的第三方 tap（历史上见过 aws/tap），
          # `brew update` 会因此打印 "The following taps are not trusted" 噪音。
          # 不要用 `brew trust <tap>` 去消音 —— 那等于把整个第三方 tap 交给 Homebrew
          # 执行，比原来的全局开关更糟。直接 untap 掉即可（已装好的 formula 不受影响）。
          # 将来若确实需要第三方 formula，用 `brew trust --formula user/repo/formula`
          # 只信任该条目，而不是整个 tap。
          for t in $(brew tap); do
            case "$t" in
              homebrew/*) continue ;;
            esac
            echo "Untapping unused third-party tap: $t"
            brew untap "$t" || true
          done
          brew update
          # 注意：不再安装 Homebrew 的 mimalloc —— 项目改用 vendored 子模块源码构建
          # （CMake/deps.cmake，MIMALLOC_LIB=mimalloc-static，MI_OVERRIDE=OFF）。
          # Homebrew 版 mimalloc.h 与子模块版本不一致时会污染 vendored 源码的编译。
          brew install cmake ninja gettext glib libusb zlib boost fftw python@3.14 qt pkg-config libzip nettle libftdi sdcc nlohmann-json

      - name: Build fx2lafw firmware
        run: |
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        env:
          # push 触发时 github.event.inputs 为空,必须给默认值,否则
          # CMAKE_BUILD_TYPE 为空 → 无 -g 调试信息 → lldb 全是 unnamed_symbol
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'RelWithDebInfo' }}
        run: |
          rm -rf build && mkdir -p build && cd build
          export LDFLAGS="-L$(brew --prefix gettext)/lib"
          export CPPFLAGS="-I$(brew --prefix gettext)/include"
          # zlib 是 keg-only,zlib.pc 不在 pkgconf 默认搜索路径;libzip.pc 依赖 zlib,
          # 不加此路径 pkgconf 解析 libzip 失败导致 CMake 配置报 "Please install libzip!"
          export PKG_CONFIG_PATH="$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix gettext)/lib/pkgconfig:$PKG_CONFIG_PATH"
          echo "BUILD_TYPE=$BUILD_TYPE"
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_INSTALL_PREFIX=../install.dir

      - name: Build and Install
        run: |
          cd build
          ninja -j 4
          ninja install

      - name: Package .app bundle (macdeployqt + Python stdlib)
        # 与 build.yml 的 macOS 打包保持一致,保证崩溃场景可复现。
        run: |
          set -e
          MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"
          APP="install.dir/PXView.app"

          # Python framework 路径修正
          PY_PREFIX="$(brew --prefix python3 2>/dev/null \
                       || brew --prefix python@3.14 2>/dev/null \
                       || brew --prefix python@3.13 2>/dev/null \
                       || brew --prefix python@3.12 2>/dev/null)"
          if [ -n "$PY_PREFIX" ]; then
            mkdir -p "$PY_PREFIX/lib"
            if [ ! -e "$PY_PREFIX/lib/Python.framework" ] && [ -e "$PY_PREFIX/Frameworks/Python.framework" ]; then
              ln -s "$PY_PREFIX/Frameworks/Python.framework" "$PY_PREFIX/lib/Python.framework"
            fi
          fi

          # macdeployqt 依赖收集 (把 Qt/Python dylib 打进 Frameworks)
          # 参数取舍见 .github/workflows/build.yml 同名步骤的注释：
          #   -no-strip    去掉默认对每个 Mach-O 的 `strip -x`
          #   -executable= 让 macdeployqt 一并处理 pxviewd
          #   -libpath=    显式给出 Homebrew 库搜索路径
          # 与 build.yml / build_macos.sh 保持同一组参数，避免行为分叉。
          "$MACDEPLOYQT" "$APP" \
            -no-strip \
            -executable="$APP/Contents/MacOS/pxviewd" \
            -libpath="$(brew --prefix)/lib" \
            || true

          # 复制 Python 标准库到 bundled Python.framework
          BUNDLED_FW="$APP/Contents/Frameworks/Python.framework"
          if [ -d "$BUNDLED_FW" ]; then
            for ver_dir in "$BUNDLED_FW"/Versions/3.*; do
              [ -d "$ver_dir" ] || continue
              py_ver=$(basename "$ver_dir")
              # macdeployqt 是把整个 Python.framework 搬进来的，Homebrew 的 framework
              # 里本就带 Versions/<ver>/lib/python<ver> 的完整 stdlib，所以这段在多数
              # 情况下是重复拷贝。只有 macdeployqt 没搬全时才需要补。
              if [ -d "$ver_dir/lib/python$py_ver/encodings" ]; then
                echo "Python stdlib (python$py_ver) 已随 framework 打包，跳过重复拷贝"
                continue
              fi
              STDLIB_SRC=""
              for fw_base in \
                "$PY_PREFIX/Frameworks/Python.framework" \
                "$PY_PREFIX/lib/Python.framework" \
                "$(brew --prefix)/Frameworks/Python.framework"; do
                if [ -d "$fw_base/Versions/$py_ver/lib/python$py_ver/encodings" ]; then
                  STDLIB_SRC="$fw_base/Versions/$py_ver/lib/python$py_ver"
                  break
                fi
              done
              if [ -z "$STDLIB_SRC" ]; then
                for candidate in "$(brew --prefix)/lib/python$py_ver" "$PY_PREFIX/lib/python$py_ver"; do
                  if [ -d "$candidate/encodings" ]; then
                    STDLIB_SRC="$candidate"
                    break
                  fi
                done
              fi
              if [ -n "$STDLIB_SRC" ]; then
                mkdir -p "$ver_dir/lib"
                cp -R "$STDLIB_SRC" "$ver_dir/lib/"
                echo "Copied Python stdlib (python$py_ver) to bundled framework"
              else
                echo "WARNING: Python stdlib not found for $py_ver"
              fi
            done
            find "$BUNDLED_FW" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
            if [ ! -e "$BUNDLED_FW/Versions/Current" ]; then
              latest_ver=$(ls -d "$BUNDLED_FW"/Versions/3.* 2>/dev/null | sort -V | tail -1)
              if [ -n "$latest_ver" ]; then
                ln -s "$(basename "$latest_ver")" "$BUNDLED_FW/Versions/Current"
                echo "Created Current symlink -> $(basename "$latest_ver")"
              fi
            fi
          else
            echo "WARNING: Python.framework not found in bundle"
          fi

          # 清除隔离标记 + 临时 ad-hoc 签名 (runner 本地运行用)
          xattr -cr "$APP" 2>/dev/null || true
          codesign --force --sign - "$APP/Contents/MacOS/PXView" 2>/dev/null || true
          codesign --force --sign - "$APP" 2>/dev/null || true
          echo "=== .app 结构 ==="
          ls "$APP/Contents/MacOS/"
          ls "$APP/Contents/Frameworks/" | head -20

      - name: Run headless under lldb and capture crash backtrace
        env:
          # push 触发时 github.event.inputs 为空,给默认值
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || 30 }}
        run: |
          set +e
          APP_BIN="/private/tmp/PXView-dbg.app/Contents/MacOS/PXView"
          rm -rf /private/tmp/PXView-dbg.app
          cp -R install.dir/PXView.app /private/tmp/PXView-dbg.app
          xattr -cr /private/tmp/PXView-dbg.app 2>/dev/null || true
          file "$APP_BIN"

          echo "=== lldb (batch) headless 启动 + 崩溃堆栈采集 ==="
          echo "等待崩溃: ${WAIT_SECONDS}s (超过后 SIGTERM 收尾)"

          # lldb batch 关键点:
          #  1. 用 `run <args>` 透传 argv (settings set target.run-args 对空格参数报错)
          #  2. 崩溃(signal stop)后,lldb batch 不会继续执行 -o 命令 —— 必须用
          #     -k (on-crash) 命令,它们只在进程崩溃时执行。
          #  3. -k 命令出错会中断后续命令(stop-on-error),所以每条必须合法:
          #     - 本 lldb 版本不支持 `bt all -s`,只能用 `bt all`
          #  4. frame #0 是 static 函数时符号表无名,必须用 image lookup --address
          #     (走 DWARF)解析真实函数名; $pc/$lr 分别给出崩溃函数与调用者。
          lldb --batch \
            -o "run --headless -l 4" \
            -k "image lookup --address \$pc" \
            -k "image lookup --address \$lr" \
            -k "bt all" \
            -k "register read pc lr x8 x9 x10 x11" \
            -k "frame variable" \
            -o "quit" \
            "$APP_BIN" > /tmp/lldb-headless.log 2>&1 &
          LLDB_PID=$!
          KILLER_PID=""

          # 若应用不崩溃,到点后给 PXView 发 SIGTERM,让 lldb 的 run 返回
          if [ "${WAIT_SECONDS:-30}" -gt 0 ] 2>/dev/null; then
            (
              sleep "$WAIT_SECONDS"
              pkill -TERM -x PXView 2>/dev/null || true
            ) &
            KILLER_PID=$!
          fi

          wait "$LLDB_PID"
          LLDB_RC=$?
          if [ -n "$KILLER_PID" ]; then
            kill "$KILLER_PID" 2>/dev/null || true
          fi

          echo "lldb exit code: $LLDB_RC"
          echo ""
          echo "=== lldb 输出 (含崩溃堆栈) ==="
          cat /tmp/lldb-headless.log
          echo ""
          echo "=== 关键摘要 (帧/符号化/寄存器) ==="
          grep -nE "frame #[0-9]|Summary:|Name:|stop reason|register read|General Purpose" /tmp/lldb-headless.log | head -120
          echo ""
          echo "=== 崩溃报告 .ips (若有) ==="
          ls -lt ~/Library/Logs/DiagnosticReports/PXView-*.ips 2>/dev/null | head -3 || echo "无 .ips 崩溃报告"

          # 收集诊断产物
          mkdir -p /tmp/diag
          cp /tmp/lldb-headless.log /tmp/diag/lldb-headless.log 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/PXView-*.ips /tmp/diag/ 2>/dev/null || true
          ls -la /tmp/diag/

      - name: Upload lldb backtrace artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lldb-backtrace
          path: |
            /tmp/diag/*.log
            /tmp/diag/*.ips
          if-no-files-found: warn
