name: Test Gates (D4 分层门禁)

# D4 CI 分层门禁：
#   L1  qtest        每次 push / PR   —— 快速回归护栏（分钟级）
#   L2  E2E 非硬件集  每日 02:00       —— 全链路功能回归（非硬件项）
#   L3  真机回归      手动 dispatch    —— 发版前，需接入 PXLogic 硬件

on:
  push:
    branches: [main, view_and_data]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'        # 每日 02:00 UTC = 10:00 北京时间
  workflow_dispatch:
    inputs:
      tier:
        description: '要运行的层: l1 (qtest) / l2 (E2E 非硬件) / l3 (真机,需硬件) / all'
        required: true
        default: 'l2'
        type: choice
        options: [l1, l2, l3, all]

# 并发保护：同一 ref 的 E2E/真机任务互斥，避免多个 headless 实例抢 10110 端口
concurrency:
  group: test-gates-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  qtest:
    name: 'L1: qtest 回归（每次）'
    if: |
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.tier == 'l1' || github.event.inputs.tier == 'all'))
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-nettle
            mingw-w64-ucrt-x86_64-libftdi
            mingw-w64-ucrt-x86_64-libusb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure (ENABLE_TESTS=ON)
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_INSTALL_PREFIX=../install.dir -DENABLE_TESTS=ON

      - name: Build
        run: cd build && ninja -j $(nproc)

      - name: Run qtest gate (ctest, 仅 qtest 快速目标)
        run: |
          cd build
          # L1 = 纯 C++/Qt 单测（秒级）。mcp_e2e_* 为全量 E2E（分钟级）→ 归 L2
          # 每日任务；此处用 -R '^test_' 只跑 qtest 目标，避免 PR 门禁被拖慢。
          ctest -R '^test_' --output-on-failure -j 4
        # ctest 失败即 PR 红：qtest 为每次提交的回归护栏

  e2e:
    name: 'L2: E2E 非硬件集（每日）'
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.tier == 'l2' || github.event.inputs.tier == 'all'))
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-nettle
            mingw-w64-ucrt-x86_64-libftdi
            mingw-w64-ucrt-x86_64-libusb
            python-pip

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure + Build + Install
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_INSTALL_PREFIX=../install.dir -DENABLE_TESTS=ON
          ninja -j $(nproc)
          ninja install

      - name: Install E2E deps
        run: |
          python -m pip install --quiet pytest pytest-timeout
          python -m pip install --quiet -e "$PWD/pxview-automation"

      - name: Run E2E (non-hardware suites)
        run: |
          cd tests
          export PXVIEW_EXE_PATH="$GITHUB_WORKSPACE/install.dir/bin/PXView.exe"
          export PXVIEW_STARTUP_TIMEOUT=180
          python -u -m pytest suites/ -v --tb=short \
            --timeout=240 --timeout-method=thread --maxfail=10 \
            --junitxml="$GITHUB_WORKSPACE/e2e-report.xml"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: e2e-report.xml
          if-no-files-found: warn

  hardware:
    name: 'L3: 真机回归（发版前，需硬件）'
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.tier == 'l3' || github.event.inputs.tier == 'all')
    runs-on: [self-hosted, windows, pxlogic]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build + Install (真机运行需完整包)
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_INSTALL_PREFIX=../install.dir -DENABLE_TESTS=ON
          ninja -j $(nproc)
          ninja install

      - name: 真机冒烟（硬件依赖项）
        run: |
          echo "=== 真机 PXLogic 回归（手动）==="
          echo "覆盖（Spec D2）："
          echo "  1) 硬件依赖 ~20 项 E2E（连接/通道/采样率/触发/深采）"
          echo "  2) A2 采集状态机复验（定时采集自然结束 → completed）"
          echo "  3) C1 实机吞吐（605 MS/s 流式 vs 2.42 GB/s 写带宽）"
          echo "  4) 真机报告归档 devdoc/"
          echo "自托管 runner 需插 PXLogic；无硬件时此层应跳过而非失败。"
          # 硬件 E2E 标记与报告在此处按项目实际标记执行
