# =============================================================================
# republish-release.yml
#
# Manually re-publish build artifacts from a past workflow run to a GitHub
# Release.  This avoids re-building when the only thing missing is the Release
# upload (e.g. publish_release was not checked, or the release step failed
# after artifacts were already uploaded).
#
# Workflow:
#   1. Download artifacts from the specified run-id (actions/download-artifact@v8)
#      — each artifact zip is auto-extracted to a sub-directory.
#   2. Collect single-file assets (.sh installer / .dmg / .exe / .zip) as-is.
#   3. Re-zip the Windows Portable directory with max compression (-9).
#   4. Upload everything to a GitHub Release via softprops/action-gh-release@v2.
#
# Usage:
#   GitHub repo → Actions → "Republish Release Assets" → Run workflow
#     run_id  : numeric ID from the source run URL (e.g. 12345678901)
#     version : must match the version used in the source build (e.g. 1.5.7)
#     tag     : target release tag (e.g. v1.5.7; leave empty → v<version>)
#     platforms: which platform artifacts to include
# =============================================================================

name: Republish Release Assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source workflow run ID (from the run URL or: gh run list)'
        required: true
      version:
        description: 'Version number used in the source build (e.g. 1.5.7)'
        required: true
        default: '1.5.7'
      tag:
        description: 'Target release tag (e.g. v1.5.7). Leave empty to derive from version.'
        required: false
        default: ''
      platforms:
        description: 'Which platform artifacts to republish'
        required: true
        default: 'all'
        type: choice
        options: [all, linux, mac, windows, portable]
      draft:
        description: 'Create/update as draft release'
        required: true
        default: true
        type: boolean

jobs:
  republish:
    name: Republish Artifacts to Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target release tag: ${TAG}"

      # ── Download artifacts from the source run ──────────────────────────
      # Each download auto-extracts the artifact zip into the path directory.
      # continue-on-error lets us skip platforms that weren't built in that run.

      - name: Download Linux Installer
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.inputs.run_id }}
          name: PXView-Linux-x86_64-Installer-${{ github.event.inputs.version }}
          path: dl/linux-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS ARM64 DMG
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'mac' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.inputs.run_id }}
          name: PXView-macOS-ARM64-${{ github.event.inputs.version }}
          path: dl/mac-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows NSIS installer
        if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.inputs.run_id }}
          name: PXView-Windows-x86_64-Setup-${{ github.event.inputs.version }}
          path: dl/win-setup
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows Portable
        if: >-
          ${{ github.event.inputs.platforms == 'all'
            || github.event.inputs.platforms == 'windows'
            || github.event.inputs.platforms == 'portable' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.inputs.run_id }}
          name: PXView-Windows-x86_64-Portable-${{ github.event.inputs.version }}
          path: dl/win-portable
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Prepare release assets ──────────────────────────────────────────

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          FOUND=0
          VER="${{ github.event.inputs.version }}"

          echo "=== Scanning downloaded artifacts ==="

          # Linux installer (.run self-extracting)
          if ls dl/linux-installer/*.run 1>/dev/null 2>&1; then
            cp dl/linux-installer/*.run release-assets/
            chmod +x release-assets/*.run
            FOUND=$((FOUND+1))
            echo "  OK: Linux installer"
          else
            echo "  SKIP: Linux installer (not found in source run)"
          fi

          # macOS DMGs (ARM64 only; x86_64 was retired)
          for pair in "dl/mac-arm64:ARM64"; do
            dir="${pair%%:*}"
            label="${pair##*:}"
            if ls "$dir"/*.dmg 1>/dev/null 2>&1; then
              cp "$dir"/*.dmg release-assets/
              FOUND=$((FOUND+1))
              echo "  OK: macOS ${label} DMG"
            else
              echo "  SKIP: macOS ${label} DMG (not found in source run)"
            fi
          done

          # Windows NSIS installer
          if ls dl/win-setup/*.exe 1>/dev/null 2>&1; then
            cp dl/win-setup/*.exe release-assets/
            FOUND=$((FOUND+1))
            echo "  OK: Windows NSIS installer"
          else
            echo "  SKIP: Windows NSIS installer (not found in source run)"
          fi

          # Windows Portable — re-zip the extracted directory with max compression
          if [ -d dl/win-portable ] && [ "$(ls -A dl/win-portable 2>/dev/null)" ]; then
            ZIP_NAME="PXView-Windows-x86_64-Portable-${VER}.zip"
            (cd dl/win-portable && zip -r -9 "../../release-assets/${ZIP_NAME}" .)
            if [ -f "release-assets/${ZIP_NAME}" ]; then
              FOUND=$((FOUND+1))
              echo "  OK: Windows Portable (re-zipped, size: $(du -h release-assets/${ZIP_NAME} | cut -f1))"
            else
              echo "  SKIP: Windows Portable (zip creation failed)"
            fi
          else
            echo "  SKIP: Windows Portable (not found in source run)"
          fi

          echo ""
          echo "=== Release assets (${FOUND} files) ==="
          ls -la release-assets/
          echo ""
          echo "Total size: $(du -sh release-assets/ | cut -f1)"

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "ERROR: No release assets were found."
            echo "       Check that run_id and version match the source build."
            echo "       run_id:    ${{ github.event.inputs.run_id }}"
            echo "       version:   ${VER}"
            echo "       platforms: ${{ github.event.inputs.platforms }}"
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: release-assets/*
          draft: ${{ github.event.inputs.draft }}
          name: PXView ${{ github.event.inputs.version }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "=== Republish complete ==="
          echo "  Source run:  ${{ github.event.inputs.run_id }}"
          echo "  Version:     ${{ github.event.inputs.version }}"
          echo "  Release tag: ${{ steps.tag.outputs.value }}"
          echo "  Draft:       ${{ github.event.inputs.draft }}"
          echo ""
          echo "  Assets uploaded:"
          ls -1 release-assets/ | sed 's/^/    /'
