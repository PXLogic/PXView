name: PXView Windows E2E Tests

# ============================================================
# 这个工作流在 "PXView Build" 编译流完成后自动触发。
# 它下载编译流上传的 Windows portable 产物，解压后启动
# PXView --headless，再运行 pytest E2E 测试套件。
#
# 也可手动触发 (workflow_dispatch)，指定编译流的 run ID。
# ============================================================

on:
  # 编译流完成后自动触发
  workflow_run:
    workflows: ["PXView Build"]
    types:
      - completed
  # 手动触发：指定从哪次编译流下载产物
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build workflow run ID to download portable package from (leave empty for latest successful)'
        required: false

jobs:
  e2e-test:
    name: Windows E2E Tests (Portable)
    runs-on: windows-2022
    # 仅在编译流成功时触发；手动触发时始终运行
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch != '') }}
    permissions:
      contents: read
      actions: read    # 需要读取其他 workflow run 的 artifacts
      checks: write    # 发布测试结果

    steps:
      # ============================================================
      # Step 1: Checkout 测试代码
      # ============================================================
      - name: Checkout test code
        uses: actions/checkout@v4

      # ============================================================
      # Step 2: 确定编译流的 run ID
      # ============================================================
      - name: Resolve build run ID
        id: build-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $runId = '${{ github.event.inputs.build_run_id }}'
            if ([string]::IsNullOrWhiteSpace($runId)) {
              Write-Host "No run ID provided, finding latest successful PXView Build..."
              $runs = gh run list `
                --workflow "build.yml" `
                --status success `
                --limit 5 `
                --json databaseId,headBranch,createdAt,displayTitle
              $runList = $runs | ConvertFrom-Json
              if ($runList.Count -eq 0) {
                Write-Host "ERROR: No successful PXView Build runs found"
                exit 1
              }
              $runId = $runList[0].databaseId
              Write-Host "Latest successful build: #$runId on branch $($runList[0].headBranch)"
            } else {
              Write-Host "Using provided build run ID: $runId"
            }
          } else {
            # workflow_run event
            $runId = '${{ github.event.workflow_run.id }}'
            $branch = '${{ github.event.workflow_run.head_branch }}'
            Write-Host "Triggered by workflow_run: build #$runId on branch $branch"
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ============================================================
      # Step 3: 下载编译流上传的 portable 产物
      # ============================================================
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.build-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'PXView-Windows-x86_64-Portable-*'
          merge-multiple: true
          path: portable-raw

      # ============================================================
      # Step 4: 定位 PXView.exe 并整理为可用目录
      # ============================================================
      - name: Locate and verify PXView.exe
        id: pkg
        shell: pwsh
        run: |
          Write-Host "=== Downloaded artifact structure ==="
          Get-ChildItem -Path "portable-raw" -Recurse -Depth 1 | 
            Select-Object FullName | Format-Table -AutoSize

          # 查找 PXView.exe
          $exe = Get-ChildItem -Path "portable-raw" -Filter "PXView.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "ERROR: PXView.exe not found in downloaded artifact"
            Write-Host "=== Full artifact listing ==="
            Get-ChildItem -Path "portable-raw" -Recurse | Select-Object FullName
            exit 1
          }

          $pkgDir = $exe.DirectoryName
          Write-Host "PXView.exe found at: $($exe.FullName)"
          Write-Host "Package directory: $pkgDir"

          # 统计关键文件
          $dlls = Get-ChildItem "$pkgDir\*.dll" -ErrorAction SilentlyContinue
          Write-Host "DLLs bundled: $($dlls.Count)"

          $cDecoders = Get-ChildItem "$pkgDir\c_decoders" -ErrorAction SilentlyContinue
          Write-Host "C decoder entries: $($cDecoders.Count)"

          if (Test-Path "$pkgDir\decoders") {
            $pyDecoders = Get-ChildItem "$pkgDir\decoders" -Directory -ErrorAction SilentlyContinue
            Write-Host "Python decoder dirs: $($pyDecoders.Count)"
          }

          "dir=$pkgDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ============================================================
      # Step 5: 安装 Python 测试依赖
      # ============================================================
      - name: Setup Python for testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-timeout requests

      # ============================================================
      # Step 6: 启动 PXView headless
      # ============================================================
      - name: Start PXView headless
        shell: pwsh
        run: |
          $pkgDir = '${{ steps.pkg.outputs.dir }}'
          $pxvExe = Join-Path $pkgDir "PXView.exe"
          # Clean up any leftover PXView processes and free port 10110
          Get-Process -Name "PXView" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          # Wait for port 10110 to be freed from TimeWait state
          for ($w = 0; $w -lt 15; $w++) {
            if (-not (Get-NetTCPConnection -LocalPort 10110 -State Listen -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }

          Write-Host "=== Starting PXView headless ==="
          Write-Host "Executable: $pxvExe"

          $logFile = "$env:TEMP\pxview_headless.log"
          $errFile = "$env:TEMP\pxview_headless.err"

          $proc = Start-Process -FilePath $pxvExe `
            -ArgumentList "--headless", "-l", "4" `
            -WorkingDirectory $pkgDir `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errFile `
            -PassThru -NoNewWindow

          Write-Host "PXView PID: $($proc.Id)"
          $proc.Id | Out-File -FilePath "$env:TEMP\pxview_pid.txt" -NoNewline

          # 等待 MCP 服务就绪（PXView 加载 200+ Python 解码器，需要约 50-60s）
          $mcpUrl = "http://127.0.0.1:10110/mcp"
          $maxWait = 120

          for ($i = 1; $i -le $maxWait; $i++) {
            if ($proc.HasExited) {
              Write-Host "ERROR: PXView exited prematurely (code: $($proc.ExitCode))"
              if (Test-Path $logFile) { Write-Host "=== stdout ==="; Get-Content $logFile -Tail 60 }
              if (Test-Path $errFile) { Write-Host "=== stderr ==="; Get-Content $errFile -Tail 60 }
              exit 1
            }

            # Use curl.exe to avoid PowerShell Invoke-RestMethod proxy issues
            $body = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
            $resp = curl.exe -s -X POST $mcpUrl -H "Content-Type: application/json" -d $body --max-time 5 2>$null
            if ($resp -and $resp -match "protocolVersion") {
              Write-Host "MCP server ready after ${i}s"
              exit 0
            }

            if ($i % 15 -eq 0) {
              Write-Host "Still waiting... (${i}s / ${maxWait}s)"
            }
            Start-Sleep -Seconds 1
          }

          Write-Host "ERROR: MCP server did not start within ${maxWait}s"
          if (Test-Path $logFile) { Write-Host "=== stdout (last 80 lines) ==="; Get-Content $logFile -Tail 80 }
          if (Test-Path $errFile) { Write-Host "=== stderr (last 80 lines) ==="; Get-Content $errFile -Tail 80 }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          exit 1

      # ============================================================
      # Step 7: 运行 pytest E2E 测试
      # ============================================================
      - name: Run E2E tests
        shell: pwsh
        run: |
          $env:PXVIEW_MCP_URL = "http://127.0.0.1:10110/mcp"
          $env:PXVIEW_STARTUP_TIMEOUT = "90"

          Write-Host "=== Running pytest E2E test suite ==="
          Set-Location tests

          python -m pytest suites/ -v `
            --tb=short `
            --html="../test_report.html" `
            --junitxml="../test_report.xml" `
            --self-contained-html
          $pytestExit = $LASTEXITCODE

          if ($pytestExit -ne 0) {
            "1" | Out-File -FilePath "$env:TEMP\test_failed.txt" -NoNewline
            Write-Host "pytest exited with code $pytestExit"
          } else {
            "0" | Out-File -FilePath "$env:TEMP\test_failed.txt" -NoNewline
            Write-Host "pytest passed"
          }

      # ============================================================
      # Step 8: 停止 PXView
      # ============================================================
      - name: Stop PXView headless
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:TEMP\pxview_pid.txt"
          if (Test-Path $pidFile) {
            $pxvPid = Get-Content $pidFile
            Write-Host "Stopping PXView (PID: $pxvPid)"
            Stop-Process -Id $pxvPid -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          $logFile = "$env:TEMP\pxview_headless.log"
          if (Test-Path $logFile) {
            Write-Host "=== PXView headless log (last 50 lines) ==="
            Get-Content $logFile -Tail 50
          }

      # ============================================================
      # Step 9: 上传测试报告
      # ============================================================
      - name: Upload test report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-html
          path: test_report.html
          if-no-files-found: warn

      - name: Upload test report (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-junit
          path: test_report.xml
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: test_report.xml
          reporter: java-junit
          fail-on-error: 'false'

      # ============================================================
      # Step 10: 最终结果
      # ============================================================
      - name: Final result
        shell: pwsh
        run: |
          $failFile = "$env:TEMP\test_failed.txt"
          $failed = $false
          if (Test-Path $failFile) {
            $val = Get-Content $failFile -Raw
            if ($val -eq "1") { $failed = $true }
          }
          if ($failed) {
            Write-Host "=== E2E TESTS FAILED ==="
            exit 1
          } else {
            Write-Host "=== ALL E2E TESTS PASSED ==="
          }
